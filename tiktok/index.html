<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <meta name="description" content="Toque nos três pontinhos acima, abra no navegador externo e entre no grupo exclusivo agora mesmo." />
    <meta property="og:title" content="Acesso Liberado — Entre no Grupo VIP" />
    <meta property="og:description" content="Abra no navegador externo e entre no grupo exclusivo." />
    <meta property="og:type" content="website" />
    <title>Acesso Liberado — Entre no Grupo VIP</title>
    <link rel="preload" href="/dz7-background.png" as="image" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --cyan: #25f4ee;
        --pink: #fe2c55;
        --ink: #050507;
        --text: #ffffff;
        --muted: #d7d7de;
        --display: "Archivo Black", "Arial Black", Impact, sans-serif;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--text); }
      body { min-width: 320px; }

      .stage { position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden; isolation: isolate; }
      .stage__media, .stage__veil, .glow { position: absolute; z-index: -1; pointer-events: none; }
      .stage__media { inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% center; z-index: -3; }
      .stage__veil { inset: 0; z-index: -2; background: linear-gradient(180deg, rgba(5,5,7,.55) 0%, rgba(5,5,7,.35) 35%, rgba(5,5,7,.85) 100%); }
      .glow { border-radius: 50%; }
      .glow--cyan { top: -140px; left: -160px; width: 420px; height: 420px; background: var(--cyan); opacity: .16; filter: blur(90px); }
      .glow--pink { bottom: -160px; right: -170px; width: 440px; height: 440px; background: var(--pink); opacity: .2; filter: blur(100px); }

      .wrap { width: 100%; max-width: 420px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; }

      .progress { width: 100%; display: flex; gap: 4px; }
      .progress span { flex: 1; height: 3px; border-radius: 2px; background: #fff; }
      .progress span:last-child { background: rgba(255,255,255,.28); }

      .hint { width: 100%; margin-top: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
      .hint__label { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(8px); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); flex: none; }
      .hint__arrow { width: 64px; height: 58px; flex: none; animation: nudge 1.6s ease-in-out infinite; }
      .hint__arrow path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

      .hero { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .badge { width: 64px; height: 64px; border-radius: 18px; background: #000; border: 2px solid rgba(255,255,255,.9); box-shadow: -4px -3px 0 var(--cyan), 4px 3px 0 var(--pink); display: grid; place-items: center; }
      .badge svg { width: 30px; height: 30px; }
      .sticker { transform: rotate(-4deg); padding: 6px 14px; border-radius: 6px; background: var(--pink); color: #fff; font-family: var(--display); font-size: 13px; letter-spacing: .06em; }
      .title { margin: 0; text-align: center; font-family: var(--display); font-weight: 400; font-size: 66px; line-height: .86; letter-spacing: -.03em; color: #fff; -webkit-text-stroke: 7px #000; paint-order: stroke fill; text-shadow: -4px -3px 0 var(--cyan), 4px 3px 0 var(--pink); }

      .card { margin-top: 22px; width: 100%; max-width: 342px; padding: 26px 22px 22px; border-radius: 28px; background: rgba(20,20,26,.82); border: 1px solid rgba(255,255,255,.12); box-shadow: -6px -6px 0 rgba(37,244,238,.35), 6px 6px 0 rgba(254,44,85,.35); display: flex; flex-direction: column; align-items: center; gap: 14px; animation: card-in .65s cubic-bezier(.2,.8,.2,1) both; }
      .lock { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); display: grid; place-items: center; }
      .lock svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .lead { margin: 0; text-align: center; font-size: 19px; line-height: 1.3; font-weight: 800; }
      .lead span { color: var(--cyan); }

      .steps { width: 100%; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
      .steps li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.05); font-size: 14px; color: var(--muted); }
      .steps b { color: #fff; }
      .num { width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
      .num--1 { background: var(--cyan); color: var(--ink); }
      .num--2 { background: var(--pink); color: #fff; }

      .cta { margin-top: 4px; width: 100%; min-height: 58px; padding: 16px; border-radius: 16px; background: #fff; color: var(--ink); text-decoration: none; font-family: var(--display); font-size: 17px; letter-spacing: .04em; box-shadow: -4px 0 0 var(--cyan), 4px 0 0 var(--pink); display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .16s ease; }
      .cta svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .cta:hover { transform: translateY(-2px); }
      .cta:active { transform: scale(.98); }
      .cta:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }

      .availability { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .14em; color: #c9c9d2; }
      .availability .dot { width: 6px; height: 6px; }
      .availability .dot--cyan { background: var(--cyan); }

      .footer { margin-top: auto; padding-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: rgba(255,255,255,.75); font-size: 12px; font-weight: 700; }
      .footer svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

      @keyframes nudge { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(4px,-6px); } }
      @keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }

      @media (max-height: 700px) {
        .title { font-size: 54px; }
        .badge { width: 52px; height: 52px; border-radius: 14px; }
        .card { margin-top: 16px; padding-block: 20px 18px; gap: 12px; }
        .lock { display: none; }
      }
      @media (min-width: 720px) { .stage__media { object-position: center 56%; } }
      @media (prefers-reduced-motion: reduce) { .hint__arrow, .card { animation: none; } .cta { transition: none; } }
    </style>
  </head>
  <body>
    <main class="stage">
      <img class="stage__media" src="/dz7-background.png" alt="" fetchpriority="high" aria-hidden="true" />
      <div class="stage__veil" aria-hidden="true"></div>
      <div class="glow glow--cyan" aria-hidden="true"></div>
      <div class="glow glow--pink" aria-hidden="true"></div>

      <div class="wrap">
        <div class="progress" aria-hidden="true"><span></span><span></span><span></span></div>

        <header class="hint" aria-label="Instrução para abrir o menu">
          <span class="hint__label"><span class="dot"></span> Menu aqui em cima</span>
          <svg class="hint__arrow" viewBox="0 0 64 58" aria-hidden="true">
            <path d="M6 54 C 14 30, 30 16, 54 8" />
            <path d="M40 6 L 55 8 L 50 22" />
          </svg>
        </header>

        <section class="hero">
          <div class="badge" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" /></svg>
          </div>
          <div class="sticker">ACESSO LIBERADO</div>
          <h1 class="title">GRUPO<br />VIP</h1>
        </section>

        <section class="card">
          <div class="lock" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
          </div>
          <p class="lead">Para entrar, toque no botão abaixo e depois em <span>“Abrir no navegador externo”</span></p>
          <ol class="steps">
            <li><span class="num num--1">1</span><span>Toque em <b>Entrar no grupo</b></span></li>
            <li><span class="num num--2">2</span><span>Escolha <b>Abrir no navegador externo</b></span></li>
          </ol>
          <a class="cta" href="https://wa.link/17pm1o" target="_blank" rel="noopener noreferrer">
            ENTRAR NO GRUPO
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="M13 6l6 6-6 6" /></svg>
          </a>
          <p class="availability"><span class="dot"></span> VAGAS LIMITADAS <span class="dot dot--cyan"></span></p>
        </section>

        <footer class="footer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
          <span>É rapidinho, leva 5 segundos</span>
        </footer>
      </div>
    </main>
  </body>
</html>
