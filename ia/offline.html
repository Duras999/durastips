<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e12">
<title>Palpiteiro · sem internet</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0e12;color:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  img{width:88px;height:88px;border-radius:22px;margin-bottom:18px;box-shadow:0 0 24px rgba(25,224,122,.25)}
  h1{font-size:22px;font-weight:800;margin-bottom:8px}
  h1 span{color:#19e07a}
  p{color:#8a96a3;line-height:1.5;max-width:300px;margin:0 auto 22px}
  button{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:16px;padding:14px 28px;cursor:pointer;
         background:linear-gradient(135deg,#19e07a,#0fb862);color:#04210f}
</style>
</head>
<body>
<div>
  <img src="icon-192.png?v=3" alt="Palpiteiro">
  <h1>Palpi<span>teiro</span></h1>
  <p>Você está sem internet. Conecte no Wi-Fi ou nos dados móveis para ver os jogos e os palpites.</p>
  <button onclick="location.href='./'">Tentar de novo</button>
</div>
<script>addEventListener("online", () => location.href = "./");</script>
</body>
</html>
