<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Palpiteiro</title>
<meta name="apple-mobile-web-app-title" content="Palpiteiro">
<meta name="application-name" content="Palpiteiro">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e12">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="shortcut icon" href="icon-192.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=5">
<meta name="description" content="Jogos do dia, estatísticas, sequências e bilhetes prontos de futebol. +18">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://sportscore.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --bg:#0b0e12; --card:#161b21; --card2:#1d242c; --line:#252d36;
    --txt:#eef2f6; --mut:#8a96a3; --green:#19e07a; --green2:#0fb862;
    --yel:#ffd34d; --red:#ff5a5a; --acc:#7c86ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body,button,a{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       padding-top:env(safe-area-inset-top);padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
  .wrap{max-width:520px;margin:0 auto}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* topo */
  .top{position:sticky;top:0;z-index:5;background:linear-gradient(#0b0e12 80%,rgba(11,14,18,0));padding:14px 16px 10px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--green),#0a8f4c);
        display:grid;place-items:center;font-weight:800;color:#04210f;font-size:15px;box-shadow:0 0 18px rgba(25,224,122,.35)}
  .home-btn{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;-webkit-tap-highlight-color:transparent}
  .home-btn:active{opacity:.7}
  .seg{display:flex;background:#16191d;border-radius:99px;padding:4px;margin:0 0 12px}
  .seg button{flex:1;padding:8px 0;border-radius:99px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;letter-spacing:.2px;text-transform:uppercase;color:#f1f2f4}
  .seg button.on{background:#e9eaec;color:#121417}
  .ctrl{display:flex;gap:10px;align-items:stretch;margin-top:10px}
  .ctrl .day{flex:1;margin-top:0}
  .live{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:99px;border:1.5px solid #e5484d;color:#e5484d;background:rgba(229,72,77,.08);font-weight:600;font-size:15px}
  .live i{width:13px;height:13px;border-radius:50%;border:2.5px solid currentColor;display:block}
  .live.on{background:#e5484d;color:#fff}
  .live.on i{background:#fff;border-color:#fff;animation:p 1.6s infinite}
  body.locked #app, body.locked nav, body.locked .ptr{display:none!important}
  #gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
  #gate[hidden]{display:none}
  .g-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
  .g-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
  .g-logo img{width:44px;height:44px;border-radius:12px}
  .g-logo h1{font-size:26px;font-weight:800}.g-logo h1 span{color:var(--green)}
  .g-card h2{text-align:center;font-size:20px}
  .g-sub{text-align:center;color:var(--mut);font-size:14px;line-height:1.45}
  .g-card input{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--txt);font:inherit;font-size:16px;outline:0}
  .g-card input:focus{border-color:var(--green)}
  .g-main{background:var(--green);color:#04210f;font-weight:800;font-size:16px;padding:14px;border-radius:14px}
  .g-google{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;font-weight:700;font-size:15px;padding:13px;border-radius:14px}
  .g-ghost{background:var(--card);color:var(--txt);font-weight:600;padding:13px;border-radius:14px}
  .g-card button:disabled{opacity:.6}
  .g-or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
  .g-or:before,.g-or:after{content:"";flex:1;height:1px;background:var(--line)}
  .g-err{color:var(--red);font-size:14px;text-align:center}
  .g-link{text-align:center;color:var(--mut);font-size:14px}.g-link a{color:var(--green);font-weight:700;text-decoration:none}
  .g-load{display:flex;justify-content:center;padding:30px}
  .g-ok{color:var(--green);font-size:14px;text-align:center}
  .g-small{text-align:center;font-size:13px}.g-small a{color:var(--mut)}
  .g-check{display:flex;align-items:flex-start;gap:10px;color:var(--mut);font-size:13px;line-height:1.4;text-align:left}
  .g-check input{width:20px;height:20px;flex:none;padding:0;accent-color:var(--green)}
  .g-warn{background:rgba(255,211,77,.1);border:1px solid rgba(255,211,77,.35);border-radius:14px;padding:12px;color:#e9d9a0;font-size:13.5px;line-height:1.45;text-align:center;display:flex;flex-direction:column;gap:10px}
  .g-warn b{color:var(--yel)}
  .g-warn a,.g-warn button{background:var(--yel);color:#111;font-weight:800;border-radius:12px;padding:11px;text-decoration:none;font-size:14px}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .brandrow .brand{margin-bottom:0}
  .hinst{flex:none;padding:8px 14px;border-radius:99px;background:rgba(25,224,122,.12);color:var(--green);font-weight:700;font-size:13px;border:1px solid rgba(25,224,122,.3)}
  .retry{display:inline-block;margin-top:14px;padding:11px 22px;border-radius:12px;background:rgba(25,224,122,.12);color:var(--green);font-weight:700}
  .quiet .fade{animation:none}
  .acct{margin:0 16px 8px;color:#5f6b77;font-size:12px;text-align:center}
  .acct button{color:var(--mut);font-size:12px;text-decoration:underline;padding:6px}
  .ptr{position:fixed;top:0;left:50%;transform:translate(-50%,-60px);z-index:30;width:42px;height:42px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--green);box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .25s}
  .ptr svg{width:22px;height:22px}
  .ptr.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .brand h1 span{color:var(--green)}
  .search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 14px;color:var(--mut)}
  .sbar{display:flex;gap:8px;align-items:stretch}
  .sbar .search{flex:1;min-width:0}
  .sbar .search input{min-width:0}
  .favbtn{flex:none;display:flex;align-items:center;gap:6px;padding:0 13px;border-radius:14px;background:var(--card);color:var(--txt);font-weight:700;font-size:13.5px;white-space:nowrap}
  .favbtn svg{width:18px;height:18px;color:var(--yel)}
  .favbtn.on svg{fill:var(--yel)}
  .fstar{color:var(--yel);font-size:12px;margin-left:5px;vertical-align:1px}
  .lbadge.favl{background:rgba(255,211,77,.14);color:var(--yel)}
  .lbadge.favl svg{width:22px;height:22px;fill:var(--yel)}
  .favnone{padding:4px 16px 14px;color:var(--mut);font-size:13.5px;line-height:1.45}
  .favnone button{color:var(--green);font-weight:700;font-size:13.5px}
  #fav{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
  #fav[hidden]{display:none}
  .fav-sheet{background:var(--bg);width:100%;max-width:520px;height:92%;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;animation:f .25s ease}
  @media(min-width:700px){#fav{align-items:center}.fav-sheet{border-radius:24px;border-bottom:1px solid var(--line);height:min(86vh,760px)}}
  .fav-head{padding:20px 16px 12px}
  .fav-head h2{font-size:21px;font-weight:800;margin-bottom:5px;letter-spacing:-.2px}
  .fav-head p{color:var(--mut);font-size:14px;line-height:1.45;margin-bottom:14px}
  .fav-body{flex:1;overflow-y:auto;padding:0 16px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .fav-lg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--mut);margin:16px 2px 9px}
  .fav-lg:first-child{margin-top:4px}
  .fav-lg img{width:18px;height:18px;object-fit:contain}
  .fav-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .fav-t{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px 11px;border-radius:16px;background:var(--card);border:1.5px solid transparent;font-size:12.5px;font-weight:600;line-height:1.2;min-width:0}
  .fav-t span{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap;padding:0 4px}
  .fav-t .crest{width:36px;height:36px;font-size:11px}
  .fav-t.on{border-color:var(--green);background:rgba(25,224,122,.09)}
  .fav-t.on span{color:var(--green)}
  .fav-t.on:after{content:"✓";position:absolute;top:6px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#04210f;font-size:11px;font-weight:900;display:grid;place-items:center}
  .fav-foot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .fav-skip{flex:none;padding:0 20px;border-radius:16px;background:var(--card);font-weight:700;color:var(--mut)}
  .fav-foot .gen{margin-top:0;flex:1}
  body.noscroll{overflow:hidden}
  .search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font:inherit;font-size:16px}
  .chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
  .chip{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);font-weight:600;font-size:14px;color:var(--mut)}
  .chip.on{background:var(--txt);color:#0b0e12}
  .chip.live{border:1.5px solid #6b2a2a;color:var(--red)}
  .day{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:99px;padding:8px 16px;margin-top:10px;font-weight:600;color:var(--acc)}

  /* ligas e jogos */
  .league{background:var(--card);border-radius:22px;margin:12px 16px;padding:6px 0 4px;overflow:hidden}
  .lhead{display:flex;align-items:center;gap:12px;padding:12px 16px}
  .lbadge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px}
  .lname{font-weight:600;font-size:15px}
  .lsub{color:var(--mut);font-size:13px;margin-top:2px}
  .match{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
  .match:active{background:var(--card2)}
  .time{width:46px;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
  .teams{flex:1;display:flex;flex-direction:column;gap:8px}
  .team{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:400}
  .crest{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;flex:none;border:2px solid rgba(255,255,255,.85)}
  .ia-tag{font-size:11px;font-weight:700;color:var(--green);background:rgba(25,224,122,.12);padding:5px 9px;border-radius:99px;white-space:nowrap}

  /* detalhe do jogo */
  .hero{position:relative;padding:14px 16px 0;background:radial-gradient(120% 90% at 20% 0%,var(--h1,#2a4a1a) 0%,transparent 65%),radial-gradient(120% 90% at 85% 0%,var(--h2,#333) 0%,transparent 60%)}
  .hbar{display:flex;justify-content:space-between;align-items:center;font-size:22px}
  .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 0 14px;text-align:center}
  .bigcrest{width:78px;height:78px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-weight:800;font-size:22px;border:3px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .tname{font-weight:700;font-size:16px}
  .kick{font-size:30px;font-weight:800}
  .kick small{display:block;font-size:13px;font-weight:500;color:#aab4be;margin-bottom:2px}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tab{flex:1;text-align:center;padding:12px 2px;color:var(--mut);font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
  .tab.on{color:var(--txt);border-color:var(--txt)}
  .tab .ia{color:var(--green)}
  .hsum{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;text-align:center;padding:4px 0 14px;border-bottom:1px solid var(--line)}
  .hsum b{display:block;font-size:24px;font-weight:800;margin-bottom:2px}
  .hsum span{font-size:13px;color:var(--mut);line-height:1.25}
  .hh{padding:11px 0;border-bottom:1px solid var(--line)}
  .hh:last-child{border:0}
  .hh-date{text-align:center;color:var(--mut);font-size:12px;margin-bottom:5px}
  .hh-line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
  .hh-t{font-size:15px;line-height:1.25}
  .hh-t.r{text-align:right}
  .hh-s{font-size:16px;font-weight:700;white-space:nowrap;min-width:52px;text-align:center}
  .tbl-box{padding:16px 8px}
  .tgroup{font-weight:700;font-size:14px;margin:14px 6px 6px;color:#cfd6dd}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  .tbl th{color:var(--mut);font-weight:600;font-size:12px;padding:6px 3px;text-align:center}
  .tbl td{padding:8px 3px;text-align:center;border-top:1px solid var(--line);color:#cfd6dd}
  .tbl .tl{text-align:left}
  .tbl .pts{font-weight:800;color:var(--txt)}
  .tbl tr.me td{background:rgba(25,224,122,.10);color:var(--txt)}
  .tbl tr.me td:first-child{border-radius:8px 0 0 8px}.tbl tr.me td:last-child{border-radius:0 8px 8px 0}
  .pos{display:inline-block;min-width:22px;padding-left:4px;border-left:3px solid transparent;text-align:left}
  .tteam{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--txt);line-height:1.2}
  .tteam img{width:18px;height:18px;object-fit:contain;flex:none}
  .cr{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;text-align:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .cr b{font-size:18px;font-weight:800}
  .cr span{font-size:13px;color:#cfd6dd}
  .cr.head{padding:0 0 6px}
  .cr.head div{display:flex;justify-content:center}
  .cexp{text-align:center;font-size:14px;color:#cfd6dd;margin-top:12px}
  .cexp b{color:#f5c518;font-size:16px}
  .cref{text-align:center;font-size:13px;color:var(--mut);margin-top:8px}
  .cref b{color:#cfd6dd;font-weight:600}
  .wp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;text-align:center;align-items:end}
  .wp>div{display:flex;flex-direction:column;align-items:center;gap:4px}
  .wp b{font-size:24px;font-weight:800}
  .wp span{font-size:13px;color:var(--mut);line-height:1.2}
  .wbar{display:flex;gap:3px;height:8px;margin-top:14px}
  .wbar i{display:block;border-radius:99px;min-width:4px}
  .box{background:var(--card);border-radius:22px;margin:12px 16px;padding:18px 16px}
  .box h3{text-align:center;font-size:19px;font-weight:700;margin-bottom:10px}
  .row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
  .row:last-child{border:0}
  .row .lbl{flex:1;text-align:center;font-size:16px;font-weight:500}
  .row .val{font-size:17px;font-weight:700;min-width:34px;text-align:right}
  .mini{width:28px;height:28px;font-size:9px}

  /* IA */
  .iahead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .pulse{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(25,224,122,.6);animation:p 1.6s infinite}
  @keyframes p{70%{box-shadow:0 0 0 10px rgba(25,224,122,0)}100%{box-shadow:0 0 0 0 rgba(25,224,122,0)}}
  .pick{background:var(--card2);border-radius:16px;padding:14px;margin-top:10px;border:1px solid var(--line)}
  .pick .mk{font-weight:800;font-size:17px}
  .pick .why{color:var(--mut);font-size:13.5px;margin-top:6px;line-height:1.45}
  .conf{display:flex;align-items:center;gap:10px;margin-top:10px}
  .bar{flex:1;height:8px;background:#2a323c;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green2),var(--green))}
  .pct{font-weight:800;font-size:14px;color:var(--green);width:42px;text-align:right}
  .add{margin-top:12px;width:100%;padding:11px;border-radius:12px;background:rgba(25,224,122,.12);color:var(--green);font-weight:700}
  .add.in{background:var(--green);color:#04210f}
  .gen{width:100%;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--green),var(--green2));color:#04210f;font-weight:800;font-size:16px;margin-top:6px}
  .thinking{display:flex;align-items:center;gap:10px;color:var(--mut);padding:18px 4px}
  .dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--green);animation:d 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes d{50%{opacity:.2;transform:translateY(-3px)}}

  /* bilhete */
  .slip-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
  .slip-item:last-child{border:0}
  .slip-item .g{color:var(--mut);font-size:13px}
  .slip-item .m{font-weight:700;margin-top:3px}
  .rm{color:var(--mut);font-size:20px;padding:0 4px}
  .empty{text-align:center;color:var(--mut);padding:40px 20px;line-height:1.6}
  .total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed #3a444f}

  .note{margin:6px 16px 20px;color:#5f6b77;font-size:12px;text-align:center;line-height:1.5}
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(92%,480px);
       display:flex;background:rgba(30,36,44,.92);backdrop-filter:blur(14px);border-radius:99px;padding:6px;z-index:9;border:1px solid #2c3540}
  .nav button{flex:1;padding:9px 0;border-radius:99px;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
  .nav button.on{background:#2b333d;color:var(--green)}
  .nav svg{width:22px;height:22px}
  .badge{position:absolute;top:3px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 6px}
  .toast{position:fixed;pointer-events:none;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--green);color:#04210f;font-weight:700;padding:10px 18px;border-radius:99px;transition:.25s;z-index:20;font-size:14px;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .fade{animation:f .25s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}}
.crest,.bigcrest{border:0!important}
  .bigcrest{box-shadow:none}
  .crest.img,.bigcrest.img{background:transparent;border-radius:0;overflow:visible}
  .crest.img img,.bigcrest.img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
  .lbadge.img{background:var(--card2)!important;overflow:hidden}
  .lbadge.img img{width:78%;height:78%;object-fit:contain}

<script>
/* ===== Palpiteiro — dados reais via SportScore (grátis, sem chave) ===== */
const API = "https://sportscore.com/api/v1";
const LEAGUES = [
  {slug:"brazilian-serie-a", name:"Brasileirão Série A", s:"A", c:"#c8f03c", tc:"#0b0e12"},
  {slug:"brazilian-serie-b", name:"Brasileirão Série B", s:"B", c:"#2b2bd6", tc:"#ffd400"},

  {slug:"uefa-champions-league", name:"Champions League", s:"UCL", c:"#0b1f6b", tc:"#fff"},

  {slug:"italian-serie-a", name:"Serie A (Itália)", s:"ITA", c:"#0a6cff", tc:"#fff"},
  {slug:"bundesliga", name:"Bundesliga", s:"BUN", c:"#d20515", tc:"#fff"}
];
const TZ = "America/Sao_Paulo";

/* ---------- bilhetes prontos (código de reserva da Bingo em Casa) ---------- */
const CASA = "https://www.bingoemcasa17.com/pt-BR/sportsbook?btBookingCode=";
const AFILIADO = "https://a.bingoem.casa/t/NTk2OTEwXzM=";
// Os bilhetes do dia são cadastrados no painel do administrador (aba Bilhetes).
function readyView() {

  if (!list.length) return "";

      b.sel.map(x => `<div class="ready-sel"><div class="g">${esc(x.jogo)}${x.hora ? " · " + esc(x.hora) : ""}</div><div class="m">${esc(x.mercado)}</div></div>`).join("") +
      `<a class="gen ready-btn" href="${b.codigo ? CASA + encodeURIComponent(b.codigo) : AFILIADO}" target="_blank" rel="noopener" onclick="window.track&&window.track('bets')">Apostar</a></div>`).join("") +

/* ---------- cache simples ---------- */
const mem = {};
function pruneStore(all) {
  try {
    const now = Date.now(), ks = Object.keys(localStorage);
    for (const k of ks) {
      if (!k.startsWith("iag:")) continue;
      let t = 0; try { t = JSON.parse(localStorage.getItem(k)).t || 0; } catch (e) {}
      if (all || now - t > 36 * 3600000) localStorage.removeItem(k);
    }
    const cards = ks.filter(k => k.startsWith("iagc:"));
    if (all || cards.length > 250) cards.forEach(k => localStorage.removeItem(k));
  } catch (e) {}
}
pruneStore(false);
function store(k, v) {
  try { localStorage.setItem(k, v); }
  catch (e) { pruneStore(true); try { localStorage.setItem(k, v); } catch (e2) {} }
}
async function getJSON(url, ttlMin) {
  const now = Date.now();
  if (mem[url] && now - mem[url].t < ttlMin * 60000) return mem[url].d;
  try { const c = JSON.parse(localStorage.getItem("iag:" + url) || "null");
        if (c && now - c.t < ttlMin * 60000) { mem[url] = c; return c.d; } } catch (e) {}
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
  let d;
  try {
    const r = await fetch(url, {signal: ctl.signal});
    if (!r.ok) throw new Error("HTTP " + r.status);
    d = await r.json();
  } catch (e) {
    // sem resposta agora: melhor mostrar o último dado guardado do que nada
    if (mem[url]) return mem[url].d;
    throw e;
  } finally { clearTimeout(timer); }
  mem[url] = {t: now, d};
  store("iag:" + url, JSON.stringify(mem[url]));
  return d;
}

/* ---------- utilitários ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slugify = n => n.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const NAMES = {"Atlético Mineiro":"Atlético-MG","Vasco da Gama":"Vasco","Atletico Clube Goianiense":"Atlético-GO","Sport Club do Recife":"Sport",
  "Esporte Clube Juventude":"Juventude","Goias Esporte Clube":"Goiás","America MG":"América-MG","Avaí FC":"Avaí","CRB AL":"CRB","Ceara":"Ceará",
  "Cuiaba":"Cuiabá","Criciuma":"Criciúma","Gremio Novorizontino":"Novorizontino","Botafogo SP":"Botafogo-SP","Gremio":"Grêmio","Goias":"Goiás",
  "Athletico Paranaense":"Athletico-PR","Atletico Mineiro":"Atlético-MG","Sao Paulo":"São Paulo","Red Bull Bragantino":"Bragantino"};
const short = n => { let x = String(n || "").replace(/\s*-\s*[A-Z]{2}$/, "").replace(/ Saf\b/i, "").trim(); return NAMES[x] || x; };
const hhmm = iso => new Date(iso).toLocaleTimeString("pt-BR", {timeZone: TZ, hour: "2-digit", minute: "2-digit"});
const localDay = d => d.toLocaleDateString("en-CA", {timeZone: TZ});
const mid = m => (m.url || "").split("/").filter(Boolean).pop();
function crest(name, logo, cls = "crest") {
  const ini = esc(short(name).slice(0, 3).toUpperCase());
  return logo ? `<span class="${cls} img"><img src="${esc(logo)}" alt="" data-ini="${ini}" onerror="crestFail(this)"></span>`
              : `<span class="${cls}">${ini}</span>`;
}
function crestFail(el){const p=el.parentNode;if(!p)return;p.classList.remove("img");p.textContent=el.dataset.ini||""}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),1600)}
function go(h){location.hash=h}
function toggleLive(){liveOnly=!liveOnly;if(liveOnly){dayOff=0;dayCache={};for(const k in mem)if(k.includes("/fixtures/"))delete mem[k];try{Object.keys(localStorage).filter(k=>k.startsWith("iag:")&&k.includes("/fixtures/")).forEach(k=>localStorage.removeItem(k))}catch(e){}}render()}
function goHome(){dayOff=0;filter="";tab="seq";homeTab="jogos";liveOnly=false;if(location.hash.slice(1)){location.hash=""}else{render();window.scrollTo({top:0,behavior:"smooth"})}}

/* ---------- estado ---------- */
let dayOff = 0, filter = "", games = {}, tab = "seq", homeTab = "jogos", liveOnly = false;
let slip = []; try { slip = JSON.parse(localStorage.getItem("iag-slip2") || "[]"); } catch (e) {}
if (!Array.isArray(slip)) slip = [];
// tira do bilhete os jogos que já acabaram faz tempo
slip = slip.filter(x => x && x.id && x.mk && !(x.t && Date.now() - new Date(x.t).getTime() > 12 * 3600000));
const saveSlip = () => { store("iag-slip2", JSON.stringify(slip)); badge(); };
const whenLabel = x => {
  if (!x.t) return x.when || "";
  const d = new Date(x.t), day = localDay(d), now = Date.now();
  const lbl = day === localDay(new Date(now)) ? "Hoje" : day === localDay(new Date(now + 86400000)) ? "Amanhã" :
    d.toLocaleDateString("pt-BR", {timeZone: TZ, day: "2-digit", month: "2-digit"});
  return lbl + " " + hhmm(x.t);
};
/* ---------- times favoritos ---------- */
const FAVKEY = "pal-favs";
let favs = null; try { favs = JSON.parse(localStorage.getItem(FAVKEY) || "null"); } catch (e) {}
if (!Array.isArray(favs)) favs = null; // null = a pessoa ainda não passou pela escolha
const STAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>`;
const tkey = n => slugify(short(n || ""));
let favIdx = new Set();
const favIndex = () => { favIdx = new Set((favs || []).flatMap(f => [f.slug, tkey(f.name)])); };
favIndex();
const isFav = name => !!name && (favIdx.has(slugify(name)) || favIdx.has(tkey(name)));
const favGame = m => isFav(m.home) || isFav(m.away);

let allTeams = null;
async function loadTeams() {
  if (allTeams) return allTeams;
  const res = await Promise.all(LEAGUES.map(L =>
    getJSON(`${API}/standings/?sport=football&competition=${L.slug}`, 1440).then(T => ({L, T})).catch(() => ({L, T: null}))));
  const seen = new Set(), out = [];
  for (const {L, T} of res) {
    const teams = [];
    for (const g of (T && T.tables) || []) for (const r of g.rows || []) {
      const slug = r.team_slug || slugify(r.team || "");
      if (!slug || !r.team || seen.has(slug)) continue;
      seen.add(slug);
      teams.push({slug, name: r.team, logo: r.team_logo || ""});
    }
    teams.sort((a, b) => short(a.name).localeCompare(short(b.name), "pt-BR"));
    if (teams.length) out.push({L, teams});
  }
  if (!out.length) throw new Error("sem times");
  return allTeams = out;
}

let favDraft = new Map(), favFirst = false;
const teamChip = t => `<button class="fav-t ${favDraft.has(t.slug) ? "on" : ""}" data-slug="${esc(t.slug)}">${crest(t.name, t.logo)}<span>${esc(short(t.name))}</span></button>`;
function favCount() {
  const b = $("#fav-ok"); if (!b) return;
  b.textContent = favDraft.size ? `Salvar ${favDraft.size} time${favDraft.size > 1 ? "s" : ""}` : (favFirst ? "Continuar" : "Salvar");
}
function drawFavs() {
  const body = $("#fav-body"); if (!body || !allTeams) return;
  const q = slugify(($("#fav-q") || {}).value || "");
  let html = "";
  for (const {L, teams} of allTeams) {
    const list = q ? teams.filter(t => tkey(t.name).includes(q) || t.slug.includes(q)) : teams;
    if (!list.length) continue;
    html += `<div class="fav-lg">${esc(L.name)}</div><div class="fav-grid">${list.map(teamChip).join("")}</div>`;
  }
  body.innerHTML = html || `<div class="empty">Nenhum time encontrado com esse nome.</div>`;
  favCount();
}
function closeFavs() {
  const el = $("#fav"); if (el) { el.hidden = true; el.innerHTML = ""; }
  document.body.classList.remove("noscroll");
}
async function openFavs(first) {
  favFirst = !!first;
  favDraft = new Map((favs || []).map(f => [f.slug, f]));
  let el = $("#fav");
  if (!el) { el = document.createElement("div"); el.id = "fav"; el.setAttribute("role", "dialog"); document.body.appendChild(el); }
  el.hidden = false; document.body.classList.add("noscroll");
  el.innerHTML = `<div class="fav-sheet"><div class="fav-head">
      <h2>${favFirst ? "Quais times você acompanha?" : "Meus times"}</h2>
      <p>${favFirst ? "Escolha seus times favoritos. Os jogos deles vão aparecer primeiro, no topo da lista." : "Toque nos times para marcar ou desmarcar."}</p>
      <div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="fav-q" placeholder="Buscar time" autocomplete="off"></div></div>
    <div class="fav-body" id="fav-body"><div class="thinking" style="justify-content:center"><span class="dots"><i></i><i></i><i></i></span> Carregando times…</div></div>
    <div class="fav-foot"><button class="fav-skip" id="fav-skip">${favFirst ? "Pular" : "Cancelar"}</button><button class="gen" id="fav-ok">Salvar</button></div></div>`;
  favCount();
  el.onclick = e => { if (e.target === el && !favFirst) closeFavs(); };
  $("#fav-q").oninput = () => { drawFavs(); $("#fav-body").scrollTop = 0; };
  $("#fav-body").onclick = e => {
    const b = e.target.closest(".fav-t"); if (!b) return;
    const slug = b.dataset.slug;
    if (favDraft.has(slug)) favDraft.delete(slug);
    else { const t = allTeams.flatMap(g => g.teams).find(x => x.slug === slug); if (t) favDraft.set(slug, t); }
    b.classList.toggle("on", favDraft.has(slug));
    favCount();
  };
  $("#fav-skip").onclick = () => {
    if (favFirst && !favs) { favs = []; store(FAVKEY, "[]"); }
    closeFavs();
  };
  $("#fav-ok").onclick = () => {
    favs = [...favDraft.values()].map(t => ({slug: t.slug, name: t.name, logo: t.logo || ""}));
    store(FAVKEY, JSON.stringify(favs)); favIndex();
    closeFavs();
    if (favs.length) toast(favs.length === 1 ? "Time salvo" : `${favs.length} times salvos`);
    render(false, true);
  };
  try { await loadTeams(); }
  catch (e) {
    const body = $("#fav-body");
    if (body) body.innerHTML = `<div class="empty">Não consegui carregar os times agora.<br><button class="retry" onclick="openFavs(${favFirst})">Tentar de novo</button></div>`;
    return;
  }
  drawFavs();
}
// primeira vez no app: pergunta os times favoritos assim que a pessoa entra
(function () {
  if (favs !== null) return;
  const t = setInterval(() => {
    if (document.body.classList.contains("locked")) return;
    clearInterval(t);
    setTimeout(() => { if (favs === null && !document.body.classList.contains("locked")) openFavs(true); }, 600);
  }, 700);
})();

const _ua = navigator.userAgent;
const isStandalone = matchMedia("(display-mode: standalone)").matches || !!navigator.standalone;
let canInstall = !isStandalone && (/iphone|ipad|ipod|android/i.test(_ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) || "onbeforeinstallprompt" in window);
function badge(){const b=$("#bdg");b.hidden=!slip.length;b.textContent=slip.length}

/* ---------- jogos do dia ---------- */
const dayOf = off => localDay(new Date(Date.now() + off * 86400000));
async function loadDay(off, fresh) {
  const day = dayOf(off);
  // o dia no Brasil pega um pedaço do dia seguinte no horário mundial: buscamos os dois
  const next = new Date(new Date(day + "T12:00:00Z").getTime() + 86400000).toISOString().slice(0, 10);
  const days = [day, next];
  const ttl = fresh ? 0 : off === 0 ? 1 : 10;
  const out = [];
  let fails = 0;
  await Promise.all(LEAGUES.map(async L => {
    const lists = await Promise.all(days.map(d =>
      getJSON(`${API}/fixtures/?sport=football&date=${d}&competition=${L.slug}&limit=100`, ttl).catch(() => { fails++; return {matches: []}; })));
    const seen = new Set();
    const ms = lists.flatMap(x => x.matches || []).filter(m => {
      const id = mid(m); if (!id || !m.time || seen.has(id)) return false; seen.add(id);
      return localDay(new Date(m.time)) === day;
    }).sort((a, b) => a.time.localeCompare(b.time));
    ms.forEach(m => { m.lname = L.name; m.lslug = L.slug; games[mid(m)] = m; });
    if (ms.length) out.push({L, ms});
  }));
  if (fails === LEAGUES.length * days.length) throw new Error("sem dados");
  return LEAGUES.map(L => out.find(o => o.L === L)).filter(Boolean);
}

/* ---------- forma do time ---------- */
async function teamForm(name) {
  let slug = slugify(name), t;
  try { t = await getJSON(`${API}/team/?slug=${slug}`, 360); } catch (e) {}
  if (!t || !t.matches || !t.matches.length) {
    const s = await getJSON(`${API}/search/?q=${encodeURIComponent(short(name))}`, 1440).catch(() => ({}));
    const hit = (s.teams || [])[0];
    if (hit) { slug = hit.slug; t = await getJSON(`${API}/team/?slug=${slug}`, 360).catch(() => null); }
  }
  const fin = ((t && t.matches) || []).filter(m => m.status === "finished" && m.home_score != null)
    .sort((a, b) => b.time.localeCompare(a.time)).slice(0, 6);
  const res = fin.map(m => {
    const home = m.home === (t.team?.name || name) || slugify(m.home) === slug;
    const gf = +(home ? m.home_score : m.away_score), ga = +(home ? m.away_score : m.home_score);
    return {gf, ga, r: gf > ga ? "V" : gf === ga ? "E" : "D", opp: home ? m.away : m.home, home, date: m.time, url: m.url};
  });
  return {slug, res};
}
function streak(res, f) { let n = 0; for (const x of res) { if (f(x)) n++; else break; } return n; }
function stats(res) {
  const n = res.length || 1;
  return {
    n: res.length,
    o25: res.filter(x => x.gf + x.ga > 2.5).length, btts: res.filter(x => x.gf > 0 && x.ga > 0).length,
    scored: res.filter(x => x.gf > 0).length, conceded: res.filter(x => x.ga > 0).length,
    ppg: res.reduce((a, x) => a + (x.r === "V" ? 3 : x.r === "E" ? 1 : 0), 0) / n,
    noWin: streak(res, x => x.r !== "V"), unbeaten: streak(res, x => x.r !== "D"), wins: streak(res, x => x.r === "V"),
    losses: streak(res, x => x.r === "D"), scoredS: streak(res, x => x.gf > 0), concS: streak(res, x => x.ga > 0),
    clean: streak(res, x => x.ga === 0), blank: streak(res, x => x.gf === 0)
  };
}
function sequences(team, logo, s) {
  const L = [], n = s.n;
  if (!n) return L;
  const add = (lbl, val, k) => L.push({team, logo, lbl, val, k});
  if (s.wins >= 2) add("Vitórias seguidas", s.wins, s.wins);
  if (s.noWin >= 3) add("Sem vitórias", s.noWin, s.noWin);
  if (s.unbeaten >= 3 && s.wins < s.unbeaten) add("Invicto", s.unbeaten, s.unbeaten);
  if (s.losses >= 2) add("Derrotas seguidas", s.losses, s.losses);
  if (s.scoredS >= 3) add("Marcou gol", s.scoredS, s.scoredS);
  if (s.concS >= 3) add("Sofreu gol", s.concS, s.concS);
  if (s.clean >= 2) add("Sem sofrer gol", s.clean, s.clean);
  if (s.blank >= 2) add("Sem marcar", s.blank, s.blank);
  if (s.o25 / n >= .6) add("Mais de 2.5 gols", `${s.o25}/${n}`, s.o25 / n * 6);
  if ((n - s.o25) / n >= .6) add("Menos de 2.5 gols", `${n - s.o25}/${n}`, (n - s.o25) / n * 6);
  if (s.btts / n >= .6) add("Ambos marcam", `${s.btts}/${n}`, s.btts / n * 6);
  if ((n - s.btts) / n >= .67) add("Ambos não marcam", `${n - s.btts}/${n}`, (n - s.btts) / n * 6);
  return L;
}
function picks(m, H, A) {
  const h = H.st, a = A.st, P = [];
  if (!h.n || !a.n) return P;
  const hn = short(m.home), an = short(m.away);
  const pct = (x, n) => x / n;
  const o = (pct(h.o25, h.n) + pct(a.o25, a.n)) / 2;
  const bt = (pct(h.btts, h.n) + pct(a.btts, a.n)) / 2;
  const add = (mk, score, why) => P.push({mk, conf: Math.max(52, Math.min(86, Math.round(score))), why});
  if (o >= .6) add("Mais de 2.5 gols", 40 + o * 50, `Teve mais de 2.5 gols em ${h.o25}/${h.n} jogos do ${hn} e ${a.o25}/${a.n} do ${an}.`);

async function cardStats(T) {
  const one = async x => {
    const slug = (x.url || "").split("/").filter(Boolean)[2];

    let c = null;
    try { c = JSON.parse(localStorage.getItem(key) || "null"); } catch (e) {}
    if (!c) {
      const r = await fetch(`${API}/match/?sport=football&slug=${slug}`).catch(() => null);
      const d = r && r.ok ? await r.json().catch(() => null) : null, mm = d && d.match;

      store(key, JSON.stringify(c));
    }
    const side = x.home ? "home" : "away";
    const mine = c.filter(i => i.side === side), opp = c.filter(i => i.side !== side);

  };
  const games = [];

    games.push(g);

  const g = games.filter(Boolean), n = g.length;
  if (!n) return null;
  const sum = k => g.reduce((a, x) => a + x[k], 0);

}
const analysis = {};
async function analyze(id) {

  H.st = stats(H.res); A.st = stats(A.res);

    getJSON(`${API}/h2h/?team1=${H.slug}&team2=${A.slug}`, 720).catch(() => null),
    m.lslug ? getJSON(`${API}/standings/?sport=football&competition=${m.lslug}`, 60).catch(() => null) : null]);
  const seq = [...sequences(short(m.home), m.home_logo, H.st), ...sequences(short(m.away), m.away_logo, A.st)].sort((x, y) => y.k - x.k);
  const R = analysis[id] = {H, A, h2h, table, cards: null, cardsBusy: true, seq, picks: picks(m, H, A)};
  Promise.all([cardStats(H).catch(() => null), cardStats(A).catch(() => null)]).then(([h, a]) => {

  });

}

function refreshDay(off, force) {
  const key = dayOf(off), c = dayCache[key];
  if (!c || c.busy) return;
  const age = Date.now() - c.t, hasLive = c.d.some(g => g.ms.some(m => m.status === "live"));
  const soon = c.d.some(g => g.ms.some(m => m.status === "upcoming" && new Date(m.time).getTime() - Date.now() < 10 * 60000));
  const max = off !== 0 ? 10 * 60000 : (hasLive || soon) ? 60000 : 4 * 60000;
  if (!force && age < max) return;
  c.busy = true;
  loadDay(off, true).then(d => {
    dayCache[key] = {t: Date.now(), d};
    const h = location.hash.slice(1);
    if ((isHome() && dayOf(dayOff) === key) || h.startsWith("jogo-")) render(document.activeElement && document.activeElement.id === "q", true);
  }).catch(() => { c.busy = false; c.t = Date.now() - max + 30000; });
}

function slipView() {
  let html = `<div class="top"><div class="brand"><button class="home-btn" onclick="goHome()" aria-label="Início"><img class="logo" src="icon-192.png?v=3" alt="Palpiteiro"></button><h1>Meu <span>bilhete</span></h1></div></div><div class="box fade">`;
  if (!slip.length) html += `<div class="empty">Seu bilhete está vazio.<br>Abra um jogo, toque em <b style="color:var(--green)">Palpites do Palpiteiro</b> e adicione as seleções.</div>`;
  else {
    html += slip.map((s, i) => `<div class="slip-item">${crest(s.h, s.hl)}<div style="flex:1">
      <div class="g">${esc(short(s.h))} x ${esc(short(s.a))} · ${esc(whenLabel(s))}</div><div class="m">${esc(s.mk)}</div>
      <div class="g" style="color:var(--green);margin-top:3px">Confiança do Palpiteiro: ${s.conf}%</div></div>
      <button class="rm" onclick="slip.splice(${i},1);saveSlip();render()">✕</button></div>`).join("");
    const avg = Math.round(slip.reduce((a, s) => a + s.conf, 0) / slip.length);
    html += `<div class="total"><span>${slip.length} seleç${slip.length > 1 ? "ões" : "ão"}</span><span>Confiança média <b style="color:var(--green)">${avg}%</b></span></div>
      <a class="gen" style="margin-top:14px;display:block;text-align:center;text-decoration:none" href="https://a.bingoem.casa/t/NTk2OTEwXzM=" target="_blank" rel="noopener" onclick="copySlip(true);window.track&&window.track('bets')">Apostar</a>`;
  }
  return html + `</div><p class="note">Quanto mais seleções, menor a chance de o bilhete inteiro bater.<br>+18 · Aposte com responsabilidade.</p>` + acct();
}
function toggle(id, mk, conf) {
  const i = slip.findIndex(s => s.id === id && s.mk === mk);
  if (i >= 0) { slip.splice(i, 1); toast("Removido do bilhete"); }
  else { const m = games[id]; if (!m) return; slip.push({id, mk, conf, h: m.home, a: m.away, hl: m.home_logo, t: m.time}); toast("Adicionado ao bilhete"); window.track && window.track("tickets"); }
  saveSlip(); render();
}
function copySlip(silent) {
  const txt = "BILHETE PALPITEIRO\n\n" + slip.map(s => `${short(s.h)} x ${short(s.a)} (${whenLabel(s)})\n${s.mk}`).join("\n\n") + "\n\n+18 | Aposte com responsabilidade";
  try { navigator.clipboard.writeText(txt).then(() => toast("Bilhete copiado"), () => { if (!silent) toast("Não deu pra copiar aqui"); }); } catch (e) {}
}

let renderId = 0;
async function render(keepFocus, quiet) {
  const my = ++renderId;
  document.body.classList.toggle("quiet", !!quiet);
  const h = location.hash.slice(1);
  $("#nav-jogos").classList.toggle("on", !h.startsWith("bilhete"));
  $("#nav-bilhete").classList.toggle("on", h.startsWith("bilhete"));
  let html;
  try {
    if (h.startsWith("jogo-")) html = await detailView(decodeURIComponent(h.slice(5)));
    else if (h === "bilhete") html = slipView();
    else html = await homeView();
  } catch (e) {
    console.error("Palpiteiro render", e);
    html = `<div class="box"><div class="empty">Deu um erro ao montar a tela.<br><button class="retry" onclick="location.hash='';render()">Voltar ao início</button></div></div>`;
  }
  if (html == null || my !== renderId) return;
  $("#app").innerHTML = html;
  if (keepFocus) { const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}
window.addEventListener("hashchange", () => { tab = "seq"; render(); window.scrollTo(0, 0); });
window.palRender = () => { if (!location.hash.slice(1) && homeTab === "palpites") render(false, true); };
/* ---------- sem zoom no celular ---------- */
["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive: false}));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});

/* ---------- arrastar pra baixo para atualizar ---------- */
(function(){
  const el = $("#ptr"), T = 70; let y0 = null, d = 0, busy = false;
  const pos = p => el.style.transform = `translate(-50%,${p - 50}px) rotate(${p * 4}deg)`;
  addEventListener("touchstart", e => { y0 = (!busy && window.scrollY <= 0 && e.touches.length === 1) ? e.touches[0].clientY : null; d = 0; }, {passive: true});
  addEventListener("touchmove", e => {
    if (y0 == null) return;
    d = (e.touches[0].clientY - y0) * 0.5;
    if (d <= 0) { el.style.transform = ""; return; }
    el.style.transition = "none"; pos(Math.min(d, T + 30));
  }, {passive: true});
  addEventListener("touchend", () => {
    if (y0 == null) return; y0 = null; el.style.transition = "";
    if (d >= T) {
      busy = true; el.classList.add("spin"); pos(T);
      try { Object.keys(localStorage).filter(k => k.startsWith("iag:")).forEach(k => localStorage.removeItem(k)); } catch (e) {}
      setTimeout(() => location.reload(), 300);
    } else el.style.transform = "";
  });
})();
badge(); render();

<div class="inst" id="inst" role="dialog" aria-label="Instalar o Palpiteiro">
  <img src="icon-192.png?v=3" alt="">
  <div class="t" id="inst-t"><b>Instale o Palpiteiro</b>Abra direto da tela inicial, igual a um app.</div>
  <button class="ok" id="inst-ok">Instalar</button>
  <button class="x" id="inst-x" aria-label="Fechar">✕</button>
</div>
<script>
/* ---------- PWA: service worker + convite para instalar ---------- */
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
(function(){
  const box = $("#inst"), KEY = "pal-inst-off";
  let snoozed = false; try { snoozed = Date.now() < +(localStorage.getItem(KEY) || 0); } catch (e) {}
  const ua = navigator.userAgent;
  const ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const inApp = /instagram|fban|fbav|fb_iab|tiktok|musical_ly|bytedance|line\//i.test(ua);
  const mobile = ios || /android/i.test(ua);
  let prompt = null;
  const locked = () => document.body.classList.contains("locked");
  const place = () => { const n = document.querySelector(".nav"); box.style.bottom = (n && !locked()) ? (innerHeight - n.getBoundingClientRect().top + 10) + "px" : ""; };
  addEventListener("resize", place);
  const reveal = () => { place(); box.classList.add("show"); };
  const hide = days => { box.classList.remove("show"); try { localStorage.setItem(KEY, Date.now() + days * 86400000); } catch (e) {} };
  const B = t => `<b style="display:inline;font-size:13px">${t}</b>`;
  const help = html => { $("#inst-t").innerHTML = html; $("#inst-ok").hidden = true; reveal(); };
  const done = () => { canInstall = false; hide(3650); if (!locked()) render(false, true); };
  $("#inst-x").onclick = () => hide(7);
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); prompt = e; });
  addEventListener("appinstalled", () => { done(); toast("Palpiteiro instalado"); });
  const install = async () => {
    if (isStandalone) return;
    if (prompt) { const p = prompt; prompt = null; p.prompt(); const r = await p.userChoice.catch(() => null); if (!r || r.outcome !== "accepted") hide(7); else box.classList.remove("show"); return; }
    if (inApp) help(`<b>Abra no navegador</b>Toque nos ${B("três pontinhos")} e escolha ${B(ios ? "Abrir no Safari" : "Abrir no Chrome")}. Lá dá pra instalar.`);
    else if (ios) help(`<b>Como instalar no iPhone</b>No Safari, toque em ${B("Compartilhar")} (quadrado com seta ↑) e depois em ${B("Adicionar à Tela de Início")}.`);
    else if (mobile) help(`<b>Como instalar</b>Abra o menu ${B("⋮")} do navegador e toque em ${B("Instalar app")} ou ${B("Adicionar à tela inicial")}.`);
    else help(`<b>Como instalar no computador</b>Clique no ícone de ${B("instalar")} no fim da barra de endereço, ou no menu ${B("⋮")} e em ${B("Instalar Palpiteiro")}.`);
  };
  $("#inst-ok").onclick = install;
  window.palInstall = install;
  window.palCanInstall = () => canInstall;
  if (isStandalone || snoozed || !canInstall) return;
  // o convite aparece sozinho só depois que a pessoa entrou no app
  const wait = setInterval(() => { if (!locked()) { clearInterval(wait); setTimeout(function tryShow() { const f = $("#fav"); if (f && !f.hidden) return setTimeout(tryShow, 4000); reveal(); }, 2500); } }, 1000);
})();
function gateFail() {

  g.hidden = false;

    <p class="g-sub">Não deu para carregar o login. Confira a internet e tente de novo.</p>
    <button class="g-main" onclick="location.reload()">Tentar de novo</button></div>`;
}
window.gateFail = gateFail;
</script>
