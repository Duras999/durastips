<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Palpiteiro · Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0e12">
<link rel="icon" type="image/png" href="../icon-192.png?v=3">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=3">
<style>
  :root{--bg:#0b0e12;--card:#161b21;--card2:#1d242c;--line:#252d36;--txt:#eef2f6;--mut:#8a96a3;--green:#19e07a;--yel:#ffd34d;--red:#ff5a5a;--blue:#4c8dff}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;touch-action:manipulation}
  button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
  input,select{font:inherit;font-size:16px}
  .wrap{max-width:980px;margin:0 auto;padding:16px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:36px;height:36px;border-radius:10px}
  .brand h1{font-size:20px;font-weight:800}.brand h1 span{color:var(--green)}
  .brand small{display:block;font-size:12px;color:var(--mut);font-weight:500}
  .who{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
  .btn{padding:9px 14px;border-radius:12px;font-weight:700;font-size:14px}
  .btn.g{background:var(--green);color:#04210f}.btn.r{background:rgba(255,90,90,.14);color:var(--red)}
  .btn.s{background:var(--card2);color:var(--txt)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .st{background:var(--card);border-radius:16px;padding:14px}
  .st b{display:block;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
  .st span{font-size:13px;color:var(--mut)}
  .st.pend b{color:var(--yel)}.st.act b{color:var(--green)}
  .tabs{display:flex;gap:6px;background:#16191d;border-radius:99px;padding:4px;margin-bottom:12px}
  .tabs button{flex:1;padding:9px;border-radius:99px;font-weight:700;font-size:14px;color:var(--mut)}
  .tabs button.on{background:#e9eaec;color:#121417}
  .tabs .n{display:inline-block;min-width:20px;padding:1px 6px;margin-left:4px;border-radius:99px;background:var(--yel);color:#111;font-size:12px}
  .bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .bar input,.bar select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--txt);outline:0}
  .bar input{flex:1;min-width:180px}
  .list{display:flex;flex-direction:column;gap:8px}
  .u{background:var(--card);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
  .av{width:40px;height:40px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}
  .u .nm{font-weight:700;font-size:15px}
  .u .ct{font-size:13px;color:var(--mut);margin-top:2px;word-break:break-all}
  .u .ct a{color:var(--green);text-decoration:none}
  .u .us{font-size:12px;color:#aab4be;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
  .u .us b{color:var(--txt)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:2px}
  .pill.pending{background:rgba(255,211,77,.15);color:var(--yel)}.pill.approved{background:rgba(25,224,122,.14);color:var(--green)}.pill.blocked{background:rgba(255,90,90,.14);color:var(--red)}
  .pill.on{background:rgba(25,224,122,.14);color:var(--green)}
  .empty{text-align:center;color:var(--mut);padding:30px;background:var(--card);border-radius:16px}
  .btn.w{background:rgba(25,224,122,.14);color:var(--green);text-decoration:none;display:inline-block;text-align:center}
  .btn:disabled{opacity:.5}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tk{background:var(--card);border-radius:16px;padding:14px}
  .tk-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .tk-h b{font-size:16px}.tk-h span{color:var(--yel);font-weight:800}
  .rsk{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:800;white-space:nowrap}
  .rsk i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .sug{color:var(--mut);font-size:12px;line-height:1.4}
  .tk-s{padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .tk-s small{display:block;color:var(--mut);font-size:12px}
  .tk-c{color:var(--mut);font-size:12px;margin-top:8px;word-break:break-all}
  .form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .form label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
  .form input,.form select{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--txt);outline:0;width:100%;min-width:0}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .selrow{display:grid;grid-template-columns:1fr 78px 1fr auto;gap:6px;align-items:center}
  .selrow button{color:var(--mut);font-size:18px;padding:4px 8px}
  @media(max-width:560px){.selrow{grid-template-columns:1fr 78px;padding-bottom:8px;border-bottom:1px solid var(--line)}.kv{grid-template-columns:repeat(2,1fr)}.who span{display:none}}
  .hint{color:var(--mut);font-size:12px;line-height:1.45}
  .tabs{overflow-x:auto}
  .tabs button{white-space:nowrap}
  .clk{cursor:pointer}
  #login{min-height:90vh;display:flex;align-items:center;justify-content:center}
  .lcard{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
  .lcard input{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--txt);outline:0}
  .lcard .btn{padding:14px;font-size:16px}
  .gbtn{background:#fff;color:#1f1f1f;font-weight:700;padding:13px;border-radius:14px}
  .err{color:var(--red);font-size:14px}
  .muted{color:var(--mut);font-size:14px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .modal[hidden]{display:none}
  .sheet{background:var(--card);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
  @media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
  .sheet h3{font-size:18px;margin-bottom:4px}
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
  .kv div{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
  .kv b{display:block;font-size:20px}.kv span{font-size:11px;color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th{color:var(--mut);font-weight:600;text-align:center;padding:6px}
  td{text-align:center;padding:8px 6px;border-top:1px solid var(--line)}
  td:first-child,th:first-child{text-align:left}
  @media(max-width:560px){.u{grid-template-columns:auto 1fr}.acts{grid-column:1/-1;justify-content:stretch}.acts .btn{flex:1}}
</style>
</head>
<body>
<div id="root"><div class="wrap muted" style="text-align:center;padding-top:40vh">Carregando…</div></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<script type="module">
import { firebaseConfig, ADMINS, SDK } from "../firebase-config.js";
const root = document.getElementById("root");
const fatal = msg => { root.innerHTML = `<div class="wrap"><div class="empty">${msg}<br><br><button class="btn s" onclick="location.reload()">Tentar de novo</button></div></div>`; };
if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("COLE")) {
  fatal("Painel ainda não configurado. Falta colar os dados do Firebase no arquivo firebase-config.js.");
  throw new Error("sem config");
}
let initializeApp, A, F;
try {
  [{ initializeApp }, A, F] = await Promise.all([
    import(`${SDK}/firebase-app.js`), import(`${SDK}/firebase-auth.js`), import(`${SDK}/firebase-firestore.js`)
  ]);
} catch (e) {
  fatal("Não deu para carregar o painel. Confira a internet.");
  throw e;
}
const app = initializeApp(firebaseConfig);
const auth = A.getAuth(app), db = F.getFirestore(app);
auth.languageCode = "pt-BR";
const admins = ADMINS.map(e => e.toLowerCase());
const APP_URL = new URL("../", location.href).href;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TZ = "America/Sao_Paulo";
const ms = t => t && t.toMillis ? t.toMillis() : 0;
const fmt = t => { const m = ms(t); if (!m) return "-"; const d = new Date(m);
  return d.toLocaleDateString("pt-BR", {timeZone: TZ, day: "2-digit", month: "2-digit"}) + " " + d.toLocaleTimeString("pt-BR", {timeZone: TZ, hour: "2-digit", minute: "2-digit"}); };
const ago = t => { const m = ms(t); if (!m) return "nunca"; const s = (Date.now() - m) / 1000;
  if (s < 120) return "agora"; if (s < 3600) return `há ${Math.floor(s / 60)} min`; if (s < 86400) return `há ${Math.floor(s / 3600)} h`; return `há ${Math.floor(s / 86400)} d`; };
const dayStr = (off = 0) => new Date(Date.now() + off * 86400000).toLocaleDateString("en-CA", {timeZone: TZ});
const startToday = () => new Date(dayStr() + "T00:00:00-03:00").getTime();
const waNum = w => { w = String(w || "").replace(/\D/g, ""); return w ? (w.length <= 11 ? "55" + w : w) : ""; };
const waFmt = w => String(w || "").replace(/^(\d{2})(\d{4,5})(\d{4})$/, "($1) $2-$3");
const wa = w => w ? `<a href="https://wa.me/${waNum(w)}" target="_blank" rel="noopener">${esc(waFmt(w))}</a>` : "";
const first = n => String(n || "").trim().split(/\s+/)[0] || "";
const welcome = u => `https://wa.me/${waNum(u.whatsapp)}?text=` + encodeURIComponent(
  `Olá${first(u.name) ? ", " + first(u.name) : ""}! Seu acesso ao Palpiteiro foi liberado ✅\n\nEntre aqui: ${APP_URL}\n\nDica: toque em "Instalar app" para deixar o Palpiteiro na tela inicial do celular.`);
const STATUS = {pending: "Pendente", approved: "Aprovado", blocked: "Bloqueado"};
// Niveis de risco, do mais seguro (verde) ao mais arriscado (vermelho).
const RISCOS = [
  {lbl: "Muito seguro",    c: "#19e07a", odd: 1.8},
  {lbl: "Seguro",          c: "#a8e05f", odd: 2.8},
  {lbl: "Médio",           c: "#ffd34d", odd: 4.5},
  {lbl: "Arriscado",       c: "#ff9a3d", odd: 8},
  {lbl: "Muito arriscado", c: "#ff5a5a", odd: Infinity}
];
const TIPOS = RISCOS.map(r => r.lbl);
const ANTIGOS = {"equilibrado": "Médio", "ousado": "Arriscado", "moderado": "Médio"};
const riscoOdd = odd => { const o = parseFloat(String(odd).replace(",", ".")); if (!(o > 1)) return null; return RISCOS.find(r => o < r.odd); };
function riscoNome(nome, odd) {
  const n = String(nome || "").trim().toLowerCase();
  const alvo = String(ANTIGOS[n] || nome || "").trim().toLowerCase();
  return RISCOS.find(r => r.lbl.toLowerCase() === alvo) || riscoOdd(odd);
}
const rskTag = r => `<span class="rsk" style="color:${r.c};background:${r.c}1f"><i></i>${r.lbl}</span>`;

let users = [], tickets = [], tab = "pend", q = "", filt = "all", tkDay = dayStr(), unsub = null, unsubT = null, ticketsErr = false;
const modal = document.getElementById("modal"), sheet = document.getElementById("sheet");
const closeModal = () => { modal.hidden = true; sheet.innerHTML = ""; if (auth.currentUser) view(); };
modal.onclick = e => { if (e.target === modal) closeModal(); };
addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

function loginView(msg) {
  root.innerHTML = `<div id="login"><div class="lcard">
    <div class="brand" style="justify-content:center"><img src="../icon-192.png?v=3" alt=""><h1>Palpi<span>teiro</span><small>Painel do administrador</small></h1></div>
    <button class="gbtn" id="gg">Entrar com Google</button>
    <div class="muted">ou</div>
    <input id="em" type="email" placeholder="E-mail" autocomplete="username" autocapitalize="off">
    <input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
    <div class="err" id="er" ${msg ? "" : "hidden"}>${esc(msg || "")}</div>
    <button class="btn g" id="go">Entrar</button></div></div>`;
  const er = m => { const e = document.getElementById("er"); e.textContent = m; e.hidden = false; };
  const go = document.getElementById("go");
  go.onclick = async () => {
    go.disabled = true;
    try { await A.signInWithEmailAndPassword(auth, document.getElementById("em").value.trim(), document.getElementById("pw").value); }
    catch (e) { go.disabled = false; er(String(e.code).includes("network") ? "Sem conexão. Verifique a internet." : "E-mail ou senha incorretos."); }
  };
  root.querySelectorAll("input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") go.click(); });
  document.getElementById("gg").onclick = async () => {
    const prov = new A.GoogleAuthProvider(); prov.setCustomParameters({prompt: "select_account"});
    try { await A.signInWithPopup(auth, prov); }
    catch (e) {
      const c = String(e && e.code);
      if (c.includes("popup-blocked") || c.includes("operation-not-supported")) { try { await A.signInWithRedirect(auth, prov); return; } catch (e2) {} }
      er(c.includes("popup-closed") || c.includes("cancelled") ? "Login com Google cancelado." : c.includes("network") ? "Sem conexão. Verifique a internet." : `Não deu para entrar com o Google. (${c})`);
    }
  };
}

function view() {
  const t0 = startToday(), w7 = Date.now() - 7 * 86400000, live = Date.now() - 10 * 60000;
  const pend = users.filter(u => u.status === "pending"), appr = users.filter(u => u.status === "approved");
  const act = (since) => appr.filter(u => ms(u.lastSeen) >= since).length;
  const bets = users.reduce((a, u) => a + (u.bets || 0), 0);
  const me = auth.currentUser;
  let body = "";
  if (tab === "tk") body = ticketsView();
  else {
    let list = tab === "pend" ? pend : users;
    if (tab === "users") {
      if (filt !== "all") list = list.filter(u => u.status === filt);
      if (q) { const s = q.toLowerCase(); list = list.filter(u => [u.name, u.email, u.whatsapp].join(" ").toLowerCase().includes(s)); }
      list = [...list].sort((a, b) => ms(b.lastSeen) - ms(a.lastSeen));
    } else list = [...list].sort((a, b) => ms(a.createdAt) - ms(b.createdAt));
    body = (tab === "users" ? `<div class="bar"><input id="q" placeholder="Buscar nome, e-mail ou WhatsApp" value="${esc(q)}">
        <select id="f"><option value="all">Todos</option><option value="approved">Aprovados</option><option value="pending">Pendentes</option><option value="blocked">Bloqueados</option></select>
        <button class="btn s" id="csv">Baixar contatos</button></div>`
      : pend.length > 1 ? `<div class="tools"><button class="btn g" id="all">Aprovar todos (${pend.length})</button></div>` : "") +
      `<div class="list">${list.length ? list.map(row).join("") : `<div class="empty">${tab === "pend" ? "Nenhum pedido aguardando." : "Nenhum usuário encontrado."}</div>`}</div>`;
  }

  root.innerHTML = `<div class="wrap">
    <header><div class="brand"><img src="../icon-192.png?v=3" alt=""><h1>Palpi<span>teiro</span><small>Painel do administrador</small></h1></div>
      <div class="who"><span>${esc(me.email)}</span><a class="btn s" href="../" style="text-decoration:none">Abrir o app</a><button class="btn s" id="out">Sair</button></div></header>
    <div class="stats">
      <div class="st"><b>${users.length}</b><span>Cadastrados</span></div>
      <div class="st pend"><b>${pend.length}</b><span>Aguardando aprovação</span></div>
      <div class="st"><b>${appr.length}</b><span>Aprovados</span></div>
      <div class="st act"><b>${act(live)}</b><span>Online agora</span></div>
      <div class="st act"><b>${act(t0)}</b><span>Ativos hoje</span></div>
      <div class="st act"><b>${act(w7)}</b><span>Ativos em 7 dias</span></div>
      <div class="st"><b>${bets}</b><span>Cliques em Apostar</span></div>
    </div>
    <div class="tabs"><button class="${tab === "pend" ? "on" : ""}" data-tab="pend">Pedidos${pend.length ? `<span class="n">${pend.length}</span>` : ""}</button>
      <button class="${tab === "users" ? "on" : ""}" data-tab="users">Usuários</button>
      <button class="${tab === "tk" ? "on" : ""}" data-tab="tk">Bilhetes</button></div>
    ${body}
  </div>`;
  const f = document.getElementById("f"); if (f) { f.value = filt; f.onchange = () => { filt = f.value; view(); }; }
  const qi = document.getElementById("q"); if (qi) qi.oninput = () => { q = qi.value; const p = qi.selectionStart; view(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(p, p); };
  const csv = document.getElementById("csv"); if (csv) csv.onclick = exportCsv;
  const all = document.getElementById("all"); if (all) all.onclick = approveAll;
  document.getElementById("out").onclick = () => A.signOut(auth);
  root.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; view(); });
  root.querySelectorAll("[data-act]").forEach(b => b.onclick = e => { e.stopPropagation(); act2(b.dataset.act, b.dataset.id); });
  root.querySelectorAll("[data-stop]").forEach(b => b.onclick = e => e.stopPropagation());
  root.querySelectorAll("[data-open]").forEach(b => b.onclick = () => detail(b.dataset.open));
  if (tab === "tk") wireTickets();
}

function row(u) {
  const online = ms(u.lastSeen) > Date.now() - 10 * 60000 && u.status === "approved";
  const fresh = u.status === "approved" && u.whatsapp && ms(u.reviewedAt) > Date.now() - 48 * 3600000;
  const acts = u.status === "pending"
    ? `<button class="btn g" data-act="approved" data-id="${esc(u.id)}">Aprovar</button><button class="btn r" data-act="blocked" data-id="${esc(u.id)}">Recusar</button>`
    : u.status === "approved" ? `${fresh ? `<a class="btn w" data-stop href="${esc(welcome(u))}" target="_blank" rel="noopener">Avisar no WhatsApp</a>` : ""}<button class="btn r" data-act="blocked" data-id="${esc(u.id)}">Bloquear</button>`
    : `<button class="btn g" data-act="approved" data-id="${esc(u.id)}">Liberar</button>`;
  return `<div class="u clk" data-open="${esc(u.id)}">
    <div class="av">${u.photo ? `<img src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer">` : esc((u.name || "?")[0].toUpperCase())}</div>
    <div><div class="nm">${esc(u.name || "Sem nome")}<span class="pill ${esc(u.status)}">${esc(STATUS[u.status] || u.status || "?")}</span>${online ? `<span class="pill on">online</span>` : ""}</div>
      <div class="ct">${[esc(u.email), wa(u.whatsapp)].filter(Boolean).join(" · ")} · ${u.provider === "google" ? "Google" : "E-mail"}</div>
      <div class="us">${u.status === "pending" ? `<span>Pediu em <b>${fmt(u.createdAt)}</b></span>` :
        `<span>Aberturas <b>${u.opens || 0}</b></span><span>Jogos vistos <b>${u.games || 0}</b></span><span>No bilhete <b>${u.tickets || 0}</b></span><span>Cliques Apostar <b>${u.bets || 0}</b></span><span>Último acesso <b>${ago(u.lastSeen)}</b></span>`}</div></div>
    <div class="acts">${acts}</div></div>`;
}

const review = status => ({status, reviewedAt: F.serverTimestamp(), reviewedBy: auth.currentUser.email});
async function act2(status, id) {
  const u = users.find(x => x.id === id); if (!u) return;
  if (status === "blocked" && !confirm(`${u.status === "pending" ? "Recusar o pedido" : "Bloquear o acesso"} de ${u.name || u.email}?`)) return;
  try { await F.updateDoc(F.doc(db, "users", id), review(status)); }
  catch (e) { alert("Não deu para salvar. Verifique a internet e as regras do Firestore."); }
}
async function approveAll() {
  const pend = users.filter(u => u.status === "pending");
  if (!pend.length || !confirm(`Aprovar os ${pend.length} pedidos de uma vez?`)) return;
  try {
    for (let i = 0; i < pend.length; i += 400) {
      const b = F.writeBatch(db);
      pend.slice(i, i + 400).forEach(u => b.update(F.doc(db, "users", u.id), review("approved")));
      await b.commit();
    }
  } catch (e) { alert("Não deu para aprovar todos. Tente de novo."); }
}
function exportCsv() {
  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["Nome", "E-mail", "WhatsApp", "Situação", "Cadastro", "Último acesso", "Aberturas", "Jogos vistos", "No bilhete", "Cliques Apostar"];
  const lines = [...users].sort((a, b) => ms(a.createdAt) - ms(b.createdAt)).map(u =>
    [u.name, u.email, waNum(u.whatsapp), STATUS[u.status] || u.status, fmt(u.createdAt), fmt(u.lastSeen), u.opens || 0, u.games || 0, u.tickets || 0, u.bets || 0].map(cell).join(";"));
  const blob = new Blob(["﻿" + [head.map(cell).join(";"), ...lines].join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `palpiteiro-contatos-${dayStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function detail(id) {
  const u = users.find(x => x.id === id); if (!u) return;
  modal.hidden = false;
  sheet.innerHTML = `<h3>${esc(u.name || "Sem nome")}<span class="pill ${esc(u.status)}">${esc(STATUS[u.status] || u.status || "?")}</span></h3>
    <div class="muted">${[esc(u.email), wa(u.whatsapp)].filter(Boolean).join(" · ")}</div>
    <div class="muted" style="margin-top:4px">Cadastro: ${fmt(u.createdAt)} · Último acesso: ${fmt(u.lastSeen)}</div>
    <div class="kv"><div><b>${u.opens || 0}</b><span>Aberturas</span></div><div><b>${u.games || 0}</b><span>Jogos vistos</span></div>
      <div><b>${u.tickets || 0}</b><span>No bilhete</span></div><div><b>${u.bets || 0}</b><span>Apostar</span></div></div>
    <div id="days" class="muted">Carregando uso por dia…</div>
    ${u.whatsapp && u.status === "approved" ? `<a class="btn w" style="width:100%;margin-top:14px" href="${esc(welcome(u))}" target="_blank" rel="noopener">Avisar no WhatsApp que foi liberado</a>` : ""}
    <button class="btn s" style="width:100%;margin-top:8px" id="close">Fechar</button>
    <button class="btn r" style="width:100%;margin-top:8px" id="del">Excluir cadastro</button>`;
  document.getElementById("close").onclick = closeModal;
  document.getElementById("del").onclick = async () => {
    if (!confirm(`Excluir o cadastro de ${u.name || u.email}?\n\nOs dados de uso dele são apagados e não dá para desfazer. Se ele entrar de novo, vira um pedido novo.`)) return;
    try {
      const days = await F.getDocs(F.collection(db, "users", id, "days")).catch(() => null);
      if (days) await Promise.all(days.docs.map(d => F.deleteDoc(d.ref).catch(() => {})));
      await F.deleteDoc(F.doc(db, "users", id));
      closeModal();
    } catch (e) { alert("Não deu para excluir. Tente de novo."); }
  };
  try {
    const s = await F.getDocs(F.query(F.collection(db, "users", id, "days"), F.orderBy("date", "desc"), F.limit(30)));
    const rows = s.docs.map(d => d.data()).filter(r => r && r.date);
    const el = document.getElementById("days"); if (!el) return;
    el.outerHTML = rows.length ? `<table><thead><tr><th>Dia</th><th>Aberturas</th><th>Jogos</th><th>Bilhete</th><th>Apostar</th></tr></thead><tbody>${
      rows.map(r => `<tr><td>${esc(String(r.date).split("-").reverse().slice(0, 2).join("/"))}</td><td>${r.opens || 0}</td><td>${r.games || 0}</td><td>${r.tickets || 0}</td><td>${r.bets || 0}</td></tr>`).join("")}</tbody></table>`
      : `<div class="muted">Ainda sem uso registrado.</div>`;
  } catch (e) { const el = document.getElementById("days"); if (el) el.textContent = "Não deu para carregar o uso por dia."; }
}

/* ---------- Bilhetes prontos do dia ---------- */
const brDay = d => String(d).split("-").reverse().join("/");
function ticketsView() {
  if (ticketsErr) return `<div class="empty">O banco de dados ainda não aceita bilhetes. Falta publicar as regras novas do Firestore (arquivo firestore.rules) no Firebase.</div>`;
  const list = tickets.filter(t => t.date === tkDay).sort((a, b) => (a.order || 0) - (b.order || 0));
  return `<div class="bar"><input type="date" id="tkd" value="${esc(tkDay)}" style="flex:none;min-width:0">
      <button class="btn s" id="tk-today">Hoje</button><button class="btn s" id="tk-tom">Amanhã</button>
      <button class="btn g" id="tk-new" style="margin-left:auto">+ Novo bilhete</button></div>
    <p class="hint" style="margin-bottom:10px">Os bilhetes de <b>${esc(brDay(tkDay))}</b> aparecem no app na aba Palpites só nesse dia. O botão Apostar abre a Bingo em Casa com o código de reserva.</p>
    <div class="list">${list.length ? list.map(t => `<div class="tk">
      <div class="tk-h">${(() => { const r = riscoNome(t.tipo, t.odd); return r ? rskTag(r) : `<b>${esc(t.tipo || "Bilhete")}</b>`; })()}<span>${t.odd ? "Odd " + esc(t.odd) : ""}</span></div>
      ${(t.sel || []).map(x => `<div class="tk-s"><small>${esc(x.jogo)}${x.hora ? " · " + esc(x.hora) : ""}</small>${esc(x.mercado)}</div>`).join("")}
      <div class="tk-c">Código de reserva: <b>${esc(t.codigo || "sem código (abre o link de cadastro)")}</b></div>
      <div class="acts" style="margin-top:10px;justify-content:flex-start"><button class="btn s" data-tke="${esc(t.id)}">Editar</button><button class="btn s" data-tkc="${esc(t.id)}">Copiar para outro dia</button><button class="btn r" data-tkx="${esc(t.id)}">Excluir</button></div>
    </div>`).join("") : `<div class="empty">Nenhum bilhete cadastrado para esse dia.</div>`}</div>`;
}
function wireTickets() {
  const d = document.getElementById("tkd"); if (!d) return;
  d.onchange = () => { if (d.value) { tkDay = d.value; view(); } };
  document.getElementById("tk-today").onclick = () => { tkDay = dayStr(); view(); };
  document.getElementById("tk-tom").onclick = () => { tkDay = dayStr(1); view(); };
  document.getElementById("tk-new").onclick = () => ticketForm(null);
  root.querySelectorAll("[data-tke]").forEach(b => b.onclick = () => ticketForm(tickets.find(t => t.id === b.dataset.tke)));
  root.querySelectorAll("[data-tkc]").forEach(b => b.onclick = () => { const t = tickets.find(x => x.id === b.dataset.tkc); if (t) ticketForm({...t, id: null, date: dayStr(1)}); });
  root.querySelectorAll("[data-tkx]").forEach(b => b.onclick = async () => {
    const t = tickets.find(x => x.id === b.dataset.tkx); if (!t) return;
    if (!confirm(`Excluir o bilhete ${t.tipo || ""} de ${brDay(t.date)}? Ele some do app na hora.`)) return;
    try { await F.deleteDoc(F.doc(db, "tickets", t.id)); } catch (e) { alert("Não deu para excluir. Tente de novo."); }
  });
}
function ticketForm(t) {
  const isNew = !t || !t.id;
  t = t || {date: tkDay, tipo: "Seguro", odd: "", codigo: "", sel: []};
  const selRow = x => `<div class="selrow"><input placeholder="Jogo (ex.: Sport x Goiás)" value="${esc(x.jogo || "")}" maxlength="80">
    <input placeholder="Hora" value="${esc(x.hora || "")}" maxlength="5" inputmode="numeric">
    <input placeholder="Palpite (ex.: Mais de 2.5 gols)" value="${esc(x.mercado || "")}" maxlength="80"><button type="button" aria-label="Tirar">✕</button></div>`;
  const nome = (riscoNome(t.tipo, null) || {}).lbl || t.tipo;
  const custom = nome && !TIPOS.includes(nome);
  modal.hidden = false;
  sheet.innerHTML = `<h3>${isNew ? "Novo bilhete" : "Editar bilhete"}</h3>
    <div class="form">
      <div class="g2"><label>Dia<input type="date" id="t-date" value="${esc(t.date || tkDay)}"></label>
        <label>Nível de risco<select id="t-tipo">${TIPOS.map(x => `<option ${nome === x ? "selected" : ""}>${x}</option>`).join("")}<option value="_" ${custom ? "selected" : ""}>Outro nome…</option></select></label></div>
      <label id="t-outro-l" ${custom ? "" : "hidden"}>Nome do bilhete<input id="t-outro" value="${esc(custom ? t.tipo : "")}" maxlength="24"></label>
      <div class="sug" id="t-sug" hidden></div>
      <div class="g2"><label>Odd total<input id="t-odd" inputmode="decimal" placeholder="3.22" value="${esc(t.odd || "")}" maxlength="8"></label>
        <label>Código de reserva<input id="t-cod" placeholder="17059B1" value="${esc(t.codigo || "")}" maxlength="24" autocapitalize="characters"></label></div>
      <p class="hint">O código de reserva é o que a Bingo em Casa mostra quando você monta o bilhete lá e toca em reservar/compartilhar.<br>O nível de risco pinta o bilhete no app, do verde (muito seguro) ao vermelho (muito arriscado).</p>
      <div style="font-weight:700;font-size:14px">Jogos do bilhete</div>
      <div id="t-sel" style="display:flex;flex-direction:column;gap:8px">${(t.sel && t.sel.length ? t.sel : [{}, {}]).map(selRow).join("")}</div>
      <button type="button" class="btn s" id="t-add">+ Adicionar jogo</button>
      <div class="err" id="t-err" hidden></div>
      <button class="btn g" id="t-save" style="padding:13px">Salvar bilhete</button>
      <button class="btn s" id="t-cancel">Cancelar</button>
    </div>`;
  const box = document.getElementById("t-sel");
  const wireRows = () => box.querySelectorAll(".selrow button").forEach(b => b.onclick = () => { if (box.children.length > 1) b.parentNode.remove(); });
  wireRows();
  document.getElementById("t-add").onclick = () => { box.insertAdjacentHTML("beforeend", selRow({})); wireRows(); box.lastElementChild.querySelector("input").focus(); };
  const tipoSel = document.getElementById("t-tipo");
  const oddIn = document.getElementById("t-odd"), sug = document.getElementById("t-sug");
  let tocouTipo = !isNew;
  const verSug = () => {
    const r = riscoOdd(oddIn.value);
    if (!r) { sug.hidden = true; return; }
    if (!tocouTipo) { tipoSel.value = r.lbl; document.getElementById("t-outro-l").hidden = true; }
    sug.hidden = false;
    sug.innerHTML = tipoSel.value === r.lbl
      ? `Pela odd ${esc(oddIn.value)}, esse bilhete é <b style="color:${r.c}">${esc(r.lbl)}</b>.`
      : `Pela odd ${esc(oddIn.value)}, costuma ser <b style="color:${r.c}">${esc(r.lbl)}</b>. <button type="button" id="t-usar" style="color:var(--green);font-weight:700;text-decoration:underline">Usar esse</button>`;
    const u = document.getElementById("t-usar");
    if (u) u.onclick = () => { tipoSel.value = r.lbl; document.getElementById("t-outro-l").hidden = true; verSug(); };
  };
  oddIn.oninput = verSug;
  tipoSel.onchange = () => { tocouTipo = true; document.getElementById("t-outro-l").hidden = tipoSel.value !== "_"; verSug(); };
  verSug();
  document.getElementById("t-cancel").onclick = closeModal;
  const save = document.getElementById("t-save");
  save.onclick = async () => {
    const er = m => { const e = document.getElementById("t-err"); e.textContent = m; e.hidden = false; };
    const date = document.getElementById("t-date").value;
    const tipo = (tipoSel.value === "_" ? document.getElementById("t-outro").value : tipoSel.value).trim();
    const odd = document.getElementById("t-odd").value.trim().replace(",", ".");
    const codigo = document.getElementById("t-cod").value.trim().replace(/\s+/g, "");
    const sel = [...box.querySelectorAll(".selrow")].map(r => { const i = r.querySelectorAll("input"); return {jogo: i[0].value.trim(), hora: i[1].value.trim(), mercado: i[2].value.trim()}; })
      .filter(x => x.jogo || x.mercado);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return er("Escolha o dia.");
    if (!tipo) return er("Dê um nome para o bilhete.");
    if (odd && !/^\d+(\.\d+)?$/.test(odd)) return er("A odd deve ser um número, tipo 3.22.");
    if (!sel.length) return er("Coloque pelo menos um jogo.");
    if (sel.some(x => !x.jogo || !x.mercado)) return er("Cada linha precisa do jogo e do palpite.");
    if (!codigo && !confirm("Sem código de reserva, o botão Apostar abre só o link de cadastro da casa, sem o bilhete montado. Salvar assim mesmo?")) return;
    save.disabled = true;
    const data = {date, tipo, odd, codigo, sel, order: TIPOS.includes(tipo) ? TIPOS.indexOf(tipo) : 9, updatedAt: F.serverTimestamp(), by: auth.currentUser.email};
    try {
      if (isNew) await F.addDoc(F.collection(db, "tickets"), {...data, createdAt: F.serverTimestamp()});
      else await F.updateDoc(F.doc(db, "tickets", t.id), data);
      tkDay = date; closeModal();
    } catch (e) { save.disabled = false; er("Não deu para salvar. Confira a internet e se as regras do Firestore foram publicadas."); }
  };
}

A.getRedirectResult(auth).catch(() => {});
let denied = "";
A.onAuthStateChanged(auth, u => {
  if (unsub) { unsub(); unsub = null; }
  if (unsubT) { unsubT(); unsubT = null; }
  modal.hidden = true;
  if (!u) { const m = denied; denied = ""; return loginView(m); }
  if (!admins.includes((u.email || "").toLowerCase())) { denied = "Essa conta não é administradora."; A.signOut(auth); return; }
  root.innerHTML = `<div class="wrap muted" style="text-align:center;padding-top:40vh">Carregando…</div>`;
  unsub = F.onSnapshot(F.collection(db, "users"), s => {
    users = s.docs.map(d => ({id: d.id, ...d.data()}));
    if (modal.hidden) view();
  }, e => fatal(u.emailVerified === false
    ? "Esse e-mail ainda não foi confirmado, então o banco não libera o painel. Entre com o Google usando o mesmo e-mail."
    : "Sem permissão para ler os usuários. Confira os e-mails de admin nas regras do Firestore."));
  // só os bilhetes recentes (de 3 dias atrás em diante)
  unsubT = F.onSnapshot(F.query(F.collection(db, "tickets"), F.where("date", ">=", dayStr(-3))), s => {
    ticketsErr = false;
    tickets = s.docs.map(d => ({id: d.id, ...d.data()}));
    if (modal.hidden && tab === "tk") view();
  }, e => { ticketsErr = true; if (modal.hidden && tab === "tk") view(); });
});
setInterval(() => { if (auth.currentUser && users.length && modal.hidden && !document.activeElement?.matches("input,select")) view(); }, 60000);
</script>
