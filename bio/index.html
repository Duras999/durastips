<style>
/* Layout: hero escuro em coluna à esquerda, foto/atmosfera à direita, CTA vermelho de Portugal */
:root{
  --bg:#070807;
  --ink:#f4f3ee;
  --muted:#b9bab3;
  --green:#3ddc6e;
  --gold:#e9c46a;
  --red:#d7262f;
  --red-2:#b4141d;
  --line:rgba(255,255,255,.14);
  --display:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;
  --body:Manrope,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--body);min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.stage{position:relative;min-height:100vh;min-height:100svh;isolation:isolate;overflow:hidden}
/* foto de fundo à direita */
.photo{position:absolute;top:0;right:0;bottom:0;width:58%;z-index:-2;background:#0b0d0b url("image.jpg") center 55%/cover no-repeat}
.mono{position:absolute;right:-2vw;top:50%;transform:translateY(-50%);z-index:-1;
  font-family:var(--display);font-weight:800;font-size:clamp(220px,38vw,560px);line-height:.8;letter-spacing:-.02em;
  color:transparent;-webkit-text-stroke:2px rgba(244,243,238,.08);user-select:none;pointer-events:none}
.fade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--bg) 0%,var(--bg) 42%,rgba(7,8,7,.6) 52%,rgba(7,8,7,.12) 72%,rgba(7,8,7,.3) 100%)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{font-family:var(--display);font-weight:800;font-style:italic;font-size:26px;letter-spacing:.01em}
.logo sup{font-size:10px;color:var(--gold);font-style:normal}
.tag{font-size:12px;color:var(--muted);letter-spacing:.02em}
.hero{max-width:460px;margin-top:110px;display:flex;flex-direction:column;gap:18px}
.k{position:relative;display:inline-block}
.k::before{content:"👑";position:absolute;left:50%;bottom:92%;transform:translateX(-50%) rotate(var(--r,0deg));font-size:.48em;line-height:1;filter:drop-shadow(0 6px 14px rgba(233,196,106,.4))}
.k.z::before{--r:6deg}
.k.d::before{--r:-6deg}
h1{font-family:var(--display);font-weight:800;font-size:clamp(64px,9vw,96px);line-height:.9;margin:0;padding-top:.5em;letter-spacing:.005em;text-wrap:balance}
h1 em{font-style:normal;color:var(--green)}
.lead{font-size:22px;line-height:1.35;margin:0;font-weight:500}
.lead b{color:var(--gold);font-weight:800}
.sub{font-size:15px;color:var(--muted);margin:0}
.sub b{color:var(--green);font-weight:800}
.arrow{align-self:center;color:var(--muted);font-size:22px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.cta{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
  background:linear-gradient(180deg,var(--red),var(--red-2));border-radius:10px;padding:16px 18px;
  box-shadow:0 10px 40px rgba(215,38,47,.35),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 48px rgba(215,38,47,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.cta:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.flag{width:38px;height:26px;border-radius:4px;flex:none;background:linear-gradient(90deg,#046a38 0 40%,#da291c 40% 100%);position:relative}
.flag::after{content:"";position:absolute;left:40%;top:50%;width:11px;height:11px;transform:translate(-50%,-50%);border-radius:50%;background:#ffe000;box-shadow:0 0 0 1.5px #b88a00}
.cta-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cta-txt strong{font-size:17px;font-weight:800}
.cta-txt span{font-size:12px;opacity:.85}
.cta .go{font-size:20px}
hr{border:0;border-top:1px solid var(--line);margin:6px 0 0;width:100%}
.raffle{display:flex;gap:14px;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.raffle svg{flex:none}
.raffle strong{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.raffle span{font-size:12px;color:var(--muted)}
@media (max-width:640px){
  .hero{margin-top:calc(60vh - 150px);margin-top:calc(60svh - 150px)}
  .photo{width:100%;height:60vh;height:60svh;bottom:auto;background:linear-gradient(180deg,rgba(7,8,7,.45) 0%,rgba(7,8,7,0) 18%,rgba(7,8,7,0) 62%,var(--bg) 100%),#0b0d0b url("image.jpg") center 50%/cover no-repeat}
  .fade{display:none}
  .tag{display:none}
}
@media (prefers-reduced-motion:reduce){.arrow{animation:none}.cta{transition:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="photo"></div>
  <div class="fade"></div>

  <div class="wrap">
    <header>
      <div class="logo">DZ<sup>®</sup></div>
      <div class="tag">Futebol. Comunidade. Green.</div>
    </header>

    <main class="hero">
      <h1><span class="k d">D</span><span class="k z">Z</span> do <em>Green</em></h1>
      <p class="lead">Me copie e faça mais de<br><b>R$ 500</b> todos os dias.</p>
      <p class="sub">Vem pra minha comunidade <b>100% gratuita.</b></p>
      <div class="arrow" aria-hidden="true">↓</div>

      <a class="cta" href="https://wa.link/gw5gm9" target="_blank" rel="noopener noreferrer">
        <span class="flag" aria-hidden="true"></span>
        <span class="cta-txt"><strong>Casa de Portugal</strong><span>Onde a gente tá fazendo as fezinhas</span></span>
        <span class="go" aria-hidden="true">→</span>
      </a>

      <hr>

      <a class="raffle" href="https://wa.link/l06f9e" target="_blank" rel="noopener noreferrer">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e9c46a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
        <span><strong>Sorteios diários</strong><span>Entre e participe dos sorteios diários.</span></span>
      </a>

    </main>
  </div>
</div>
<script>
  document.querySelectorAll('a[href*="wa.link"]').forEach(function(a){
    a.addEventListener('click', function(){ if (window.fbq) fbq('track','Lead'); });
  });
</script>
</body>
</html>
