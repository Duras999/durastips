<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DZ do Green | Comunidade gratuita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070807; --text:#f3f1ea; --muted:#c3c7c1; --dim:#a7aca6;
    --green:#2fd668; --gold:#f2b84b; --red1:#d9262f; --red2:#b4161f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font-family:Manrope,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;
    background:radial-gradient(ellipse 60% 70% at 72% 45%,rgba(34,140,70,.22),rgba(7,8,7,0) 70%),var(--bg)}
  a{color:inherit;text-decoration:none}
  .bg-dz{position:fixed;right:-40px;top:180px;font-family:'Barlow Condensed',sans-serif;font-weight:800;
    font-size:520px;line-height:.8;color:transparent;-webkit-text-stroke:1.5px rgba(47,214,104,.10);
    letter-spacing:-10px;pointer-events:none;user-select:none}
  .wrap{position:relative;max-width:1080px;margin:0 auto;padding:32px 16px 64px;display:flex;flex-direction:column;gap:96px}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:28px}
  nav{display:flex;gap:24px;font-size:14px;color:var(--dim)}
  nav .g{color:var(--green);font-weight:600}
  main{display:flex;flex-direction:column;gap:24px;max-width:480px}
  .crowns{display:flex;gap:6px}
  h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(64px,14vw,96px);line-height:.92;letter-spacing:-1px}
  h1 span{color:var(--green)}
  .lead{margin:0;font-size:22px;line-height:1.35;font-weight:600}
  .lead b{color:var(--gold);font-weight:800}
  .sub{margin:0;font-size:15px;color:var(--muted)}
  .sub strong{color:var(--green)}
  .ctas{display:flex;flex-direction:column;gap:14px;margin-top:12px}
  .btn{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:12px;min-height:44px;transition:transform .15s ease,box-shadow .15s ease}
  .btn:hover{transform:translateY(-2px)}
  .btn .t{display:flex;flex-direction:column;gap:2px;flex:1}
  .btn-red{background:linear-gradient(180deg,var(--red1),var(--red2));color:#fff;box-shadow:0 10px 40px rgba(217,38,47,.35)}
  .btn-red .title{font-size:18px;font-weight:800}
  .btn-red .desc{font-size:13px;opacity:.9}
  .btn-green{border:1px solid rgba(47,214,104,.35);background:rgba(47,214,104,.06);padding:16px 20px}
  .btn-green .title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800}
  .btn-green .desc{font-size:13px;color:var(--muted)}
  .legal{margin:8px 0 0;font-size:12px;color:var(--dim)}
  @media (max-width:600px){.bg-dz{font-size:300px;top:auto;bottom:-40px}.wrap{gap:56px}}
</style>
</head>
<body>
<div class="bg-dz" aria-hidden="true">DZ</div>
<div class="wrap">
  <header>
    <a class="logo" href="/">DZ</a>
    <nav><span>Futebol.</span><span>Comunidade.</span><span class="g">Green.</span></nav>
  </header>

  <main>
    <div class="crowns" aria-hidden="true">
      <svg width="40" height="32" viewBox="0 0 40 32" fill="none"><path d="M4 26 L2 8 L12 16 L20 4 L28 16 L38 8 L36 26 Z" fill="#f2b84b" stroke="#c98a1f" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="18" r="3" fill="#2f6fe0"/><circle cx="11" cy="20" r="2.2" fill="#e04848"/><circle cx="29" cy="20" r="2.2" fill="#e04848"/></svg>
      <svg width="40" height="32" viewBox="0 0 40 32" fill="none"><path d="M4 26 L2 8 L12 16 L20 4 L28 16 L38 8 L36 26 Z" fill="#f2b84b" stroke="#c98a1f" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="18" r="3" fill="#2f6fe0"/><circle cx="11" cy="20" r="2.2" fill="#e04848"/><circle cx="29" cy="20" r="2.2" fill="#e04848"/></svg>
    </div>

    <h1>DZ do <span>Green</span></h1>
    <p class="lead">Me copie e faça mais de<br><b>R$ 500</b> todos os dias.</p>
    <p class="sub">Vem pra minha comunidade <strong>100% gratuita.</strong></p>

    <div class="ctas">
      <a class="btn btn-red" href="https://wa.link/w0fnua" target="_blank" rel="noopener">
        <svg width="36" height="26" viewBox="0 0 36 26" aria-hidden="true"><rect width="14" height="26" rx="3" fill="#0a7a2f"/><rect x="14" width="22" height="26" rx="3" fill="#e0202a"/><circle cx="14" cy="13" r="6" fill="#f5d020"/></svg>
        <span class="t"><span class="title">Casa de Portugal</span><span class="desc">Onde a gente tá fazendo as fezinhas</span></span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>

      <a class="btn btn-green" href="https://wa.link/17pm1o" target="_blank" rel="noopener">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f2b84b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s4 1 6 1c2 0 6 2 6-1s-4-3-6 1"/></svg>
        <span class="t"><span class="title">Sorteios diários</span><span class="desc">Entre e participe dos sorteios diários.</span></span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2fd668" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>

    <p class="legal">+18 · Aposte com responsabilidade.</p>
  </main>
</div>
</body>
</html>
