<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crie sua conta</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0d0d0d;
    min-height: 100vh;
  }

  /* Fundo escurecido atrás do modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    z-index: 1000;
  }
  .overlay.hidden { display: none; }

  .modal {
    width: 100%; max-width: 440px;
    max-height: 100%;
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }

  /* Cabeçalho escuro */
  .modal-header {
    background: #1f1f1f;
    padding: 18px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    width: 46px; height: 46px; border-radius: 50%;
    background: #1a3d2a; border: 3px solid #b8323a;
    display: flex; align-items: center; justify-content: center;
    color: #e8c46a; font-weight: 700; font-size: 20px;
  }
  .modal-header h2 { color: #fff; font-size: 20px; font-weight: 500; }
  .close-btn {
    background: none; border: none; cursor: pointer;
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
  }

  .modal-body { padding: 28px 38px 32px; overflow-y: auto; }

  /* Barra de progresso em 3 etapas */
  .progress { display: flex; gap: 8px; margin-bottom: 28px; }
  .progress span {
    flex: 1; height: 4px; border-radius: 4px; background: #e6e6e6;
    position: relative; overflow: hidden;
  }
  .progress span.active::after {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 20%; background: #1f1f1f; border-radius: 4px;
  }

  /* Botões sociais */
  .social-btn {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    padding: 14px 20px; margin-bottom: 16px;
    background: #fff; border: 1.5px solid #e2e2e2; border-radius: 40px;
    font: 500 16px 'Inter', sans-serif; color: #1f1f1f;
    cursor: pointer; transition: background .2s;
  }
  .social-btn:hover { background: #f6f6f6; }
  .social-btn svg { width: 24px; height: 24px; flex-shrink: 0; }

  /* Divisor OU */
  .divider {
    display: flex; align-items: center; gap: 16px;
    margin: 24px 0; color: #1f1f1f; font-size: 14px;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e2e2; }

  /* Alternador e-mail / celular */
  .tabs {
    display: flex; background: #f4f4f4; border-radius: 40px;
    padding: 5px; margin: 0 auto 28px; max-width: 300px;
  }
  .tab {
    flex: 1; padding: 11px 0; border: none; border-radius: 40px;
    background: transparent; color: #9a9a9a;
    font: 500 15px 'Inter', sans-serif; cursor: pointer; transition: .2s;
  }
  .tab.active { background: #2a2a2a; color: #fff; }

  /* Campos */
  .field { margin-bottom: 22px; }
  .field label { display: block; font-size: 17px; color: #1f1f1f; margin-bottom: 10px; }
  .field label .req { color: #c62828; }
  .input-wrap { position: relative; display: flex; align-items: center; }
  .input-wrap input {
    width: 100%; padding: 15px 22px;
    background: #f6f7f9; border: 1.5px solid #e2e2e2; border-radius: 40px;
    font: 400 16px 'Inter', sans-serif; color: #1f1f1f; outline: none;
    transition: border-color .2s;
  }
  .input-wrap input::placeholder { color: #a0a4ab; }
  .input-wrap input:focus { border-color: #1f1f1f; background: #fff; }
  .input-wrap.has-prefix input { padding-left: 64px; }
  .prefix { position: absolute; left: 22px; color: #1f1f1f; font-size: 16px; }
  .eye-btn {
    position: absolute; right: 18px; background: none; border: none;
    cursor: pointer; display: flex; padding: 4px;
  }
  .hidden { display: none; }

  /* Botão Continuar */
  .submit-btn {
    width: 100%; padding: 17px; margin-top: 10px;
    border: none; border-radius: 40px;
    background: #f5b324; color: #1f1f1f;
    font: 500 17px 'Inter', sans-serif; cursor: pointer; transition: .2s;
  }
  .submit-btn:disabled { background: #f1cf94; color: #8d8270; cursor: not-allowed; }

  /* Já tem conta */
  .login-link {
    text-align: center; margin: 24px 0 48px;
    font-size: 17px; color: #1f1f1f;
  }
  .login-link a { color: #e8a93a; text-decoration: none; }
  .login-link a:hover { text-decoration: underline; }

  @media (max-width: 400px) {
    .modal-body { padding: 24px 20px 28px; }
    .modal-header h2 { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="overlay" id="cadastroModal">
  <div class="modal" role="dialog" aria-labelledby="tituloModal">

    <div class="modal-header">
      <!-- Troque esta div pela imagem do seu logo: <img src="logo.png" width="46" height="46"> -->
      <div class="logo">D</div>
      <h2 id="tituloModal">Crie sua conta</h2>
      <button class="close-btn" aria-label="Fechar" onclick="fecharModal()">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
          <path d="M5 5l14 14M19 5L5 19"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="progress">
        <span class="active"></span><span></span><span></span>
      </div>

      <button class="social-btn" type="button" id="btnGoogle">
        <svg viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        Continuar com o Google
      </button>

      <button class="social-btn" type="button" id="btnTelegram">
        <svg viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="22" fill="#3d9ae0"/>
          <path fill="#fff" d="M34.5 15.2L30.6 33c-.3 1.3-1 1.6-2.1 1l-5.8-4.3-2.8 2.7c-.3.3-.6.6-1.2.6l.4-5.9 10.8-9.8c.5-.4-.1-.6-.7-.2L15.8 25.5l-5.7-1.8c-1.2-.4-1.3-1.2.3-1.8l22.4-8.6c1-.4 2 .2 1.7 1.9z"/>
        </svg>
        Continuar com Telegram
      </button>

      <div class="divider">OU</div>

      <div class="tabs">
        <button class="tab active" type="button" data-modo="email">Por e-mail</button>
        <button class="tab" type="button" data-modo="celular">Com celular</button>
      </div>

      <form id="formCadastro" novalidate>
        <div class="field" id="campoEmail">
          <label for="email">E-mail <span class="req">*</span></label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email">
          </div>
        </div>

        <div class="field hidden" id="campoCelular">
          <label for="celular">Celular <span class="req">*</span></label>
          <div class="input-wrap has-prefix">
            <span class="prefix">+55</span>
            <input type="tel" id="celular" placeholder="(00) 00000-0000" autocomplete="tel" maxlength="15">
          </div>
        </div>

        <div class="field">
          <label for="senha">Senha <span class="req">*</span></label>
          <div class="input-wrap">
            <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="new-password" style="padding-right:56px">
            <button type="button" class="eye-btn" id="btnOlho" aria-label="Mostrar senha">
              <svg id="iconeOlho" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
                <path id="riscoOlho" d="M4 4l16 16"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="btnContinuar" disabled>Continuar</button>
      </form>

      <p class="login-link">Já tem uma conta? <a href="#" id="linkEntrar">Entrar agora!</a></p>
    </div>
  </div>
</div>

<script>
  let modo = 'email';
  const email = document.getElementById('email');
  const celular = document.getElementById('celular');
  const senha = document.getElementById('senha');
  const btnContinuar = document.getElementById('btnContinuar');

  // Alternar entre e-mail e celular
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      modo = tab.dataset.modo;
      document.getElementById('campoEmail').classList.toggle('hidden', modo !== 'email');
      document.getElementById('campoCelular').classList.toggle('hidden', modo !== 'celular');
      validar();
    });
  });

  // Máscara do celular: (00) 00000-0000
  celular.addEventListener('input', () => {
    let v = celular.value.replace(/\D/g, '').slice(0, 11);
    if (v.length > 6) v = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
    else if (v.length > 2) v = `(${v.slice(0,2)}) ${v.slice(2)}`;
    else if (v.length > 0) v = `(${v}`;
    celular.value = v;
  });

  // Mostrar / esconder senha
  document.getElementById('btnOlho').addEventListener('click', () => {
    const visivel = senha.type === 'text';
    senha.type = visivel ? 'password' : 'text';
    document.getElementById('riscoOlho').style.display = visivel ? '' : 'none';
  });

  // Libera o botão Continuar só quando os campos estão válidos
  function validar() {
    const contatoOk = modo === 'email'
      ? /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)
      : celular.value.replace(/\D/g, '').length === 11;
    btnContinuar.disabled = !(contatoOk && senha.value.length >= 6);
  }
  [email, celular, senha].forEach(i => i.addEventListener('input', validar));

  document.getElementById('formCadastro').addEventListener('submit', e => {
    e.preventDefault();
    // Aqui você envia os dados para o seu sistema de cadastro (backend)
    alert('Cadastro enviado!');
  });

  document.getElementById('btnGoogle').onclick = () => alert('Conectar login com Google aqui');
  document.getElementById('btnTelegram').onclick = () => alert('Conectar login com Telegram aqui');

  function fecharModal() { document.getElementById('cadastroModal').classList.add('hidden'); }
  function abrirModal() { document.getElementById('cadastroModal').classList.remove('hidden'); }
</script>
</body>
</html>
