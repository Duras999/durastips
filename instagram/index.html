<style>
/* Layout: coluna central; foto escurecida no topo; vídeo 16:9 abaixo do título; CTA vermelho */
:root{
  --bg:#070807;
  --ink:#f4f3ee;
  --muted:#b9bab3;
  --green:#3ddc6e;
  --gold:#e9c46a;
  --red:#d7262f;
  --red-2:#b4141d;
  --line:rgba(255,255,255,.18);
  --display:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;
  --body:Manrope,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--body);min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.stage{position:relative;min-height:100vh;min-height:100svh;isolation:isolate;overflow:hidden}
/* foto de fundo no topo, escurecida */
.photo{position:absolute;top:0;left:0;right:0;height:62vh;height:62svh;z-index:-1;
  background:linear-gradient(180deg,rgba(7,8,7,.55) 0%,rgba(7,8,7,.45) 40%,rgba(7,8,7,.8) 75%,var(--bg) 100%),#0b0d0b url("/bio/image.jpg") center 35%/cover no-repeat}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{font-family:var(--display);font-weight:800;font-style:italic;font-size:30px;letter-spacing:.01em}
.logo sup{font-size:10px;color:var(--gold);font-style:normal}
.tag{font-size:12px;color:var(--ink);opacity:.85;letter-spacing:.02em}
.hero{margin-top:clamp(70px,16vh,150px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px}
.k{position:relative;display:inline-block}
.k::before{content:"\1F451";position:absolute;left:50%;bottom:92%;transform:translateX(-50%) rotate(var(--r,0deg));font-size:.48em;line-height:1;filter:drop-shadow(0 6px 14px rgba(233,196,106,.4))}
.k.z::before{--r:6deg}
.k.d::before{--r:-6deg}
h1{font-family:var(--display);font-weight:800;font-size:clamp(56px,16vw,96px);line-height:.9;margin:0;padding-top:.5em;letter-spacing:.005em;white-space:nowrap}
h1 em{font-style:normal;color:var(--green)}
.vid{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#000;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.vid video{display:block;width:100%;height:100%;object-fit:cover}
.lead{font-size:22px;line-height:1.35;margin:4px 0 0;font-weight:500;text-wrap:balance}
.lead b{color:var(--gold);font-weight:800}
.arrow{color:var(--gold);font-size:28px;line-height:1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.cta{width:100%;display:flex;align-items:center;gap:16px;text-align:left;text-decoration:none;color:var(--ink);
  background:linear-gradient(180deg,var(--red),var(--red-2));border:1px solid rgba(255,140,140,.45);border-radius:12px;padding:20px 20px;
  box-shadow:0 14px 50px rgba(215,38,47,.38),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-2px);box-shadow:0 18px 56px rgba(215,38,47,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.cta:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.flag{width:40px;height:28px;border-radius:4px;flex:none;background:linear-gradient(90deg,#046a38 0 42%,#da291c 42% 100%);position:relative}
.flag::after{content:"";position:absolute;left:42%;top:50%;width:11px;height:11px;transform:translate(-50%,-50%);border-radius:50%;background:#ffe000;box-shadow:0 0 0 1.5px #b88a00}
.cta-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cta-txt strong{font-size:19px;font-weight:800}
.cta-txt span{font-size:13px;opacity:.88}
.cta .go{font-size:22px}
hr{border:0;border-top:1px solid rgba(233,196,106,.25);margin:10px 0 0;width:100%}
.raffle{display:flex;gap:14px;align-items:center;justify-content:center;text-align:left;text-decoration:none;color:var(--ink)}
.raffle svg{flex:none}
.raffle strong{display:block;font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.raffle span{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.arrow{animation:none}.cta{transition:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="photo"></div>

  <div class="wrap">
    <header>
      <div class="logo">DZ<sup>®</sup></div>
      <div class="tag">Futebol. Comunidade. Green.</div>
    </header>

    <main class="hero">
      <h1><span class="k d">D</span><span class="k z">Z</span> do <em>Green</em></h1>

      <!-- VÍDEO: quando tiver o vídeo, suba como instagram/video.mp4 e troque a linha abaixo por:
           <video src="video.mp4" playsinline muted autoplay loop controls preload="metadata"></video> -->
      <div class="vid" id="vid"></div>

      <p class="lead">Me copie e faça mais de <b>R$ 500</b> todos os dias.</p>
      <div class="arrow" aria-hidden="true">↓</div>

      <a class="cta" href="https://wa.link/br0mfa" target="_blank" rel="noopener noreferrer">
        <span class="flag" aria-hidden="true"></span>
        <span class="cta-txt"><strong>Casa de Portugal</strong><span>Onde a gente tá fazendo as fezinhas</span></span>
        <span class="go" aria-hidden="true">→</span>
      </a>

      <hr>

      <a class="raffle" href="https://wa.link/l06f9e" target="_blank" rel="noopener noreferrer">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e9c46a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
        <span><strong>Sorteios diários</strong><span>Entre e participe dos sorteios diários.</span></span>
      </a>
    </main>
  </div>
</div>
<script>
  document.querySelectorAll('a[href*="wa.link"]').forEach(function(a){
    a.addEventListener('click', function(){ if (window.fbq) fbq('track','Lead'); });
  });
</script>
</body>
</html>
